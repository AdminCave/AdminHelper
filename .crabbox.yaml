profile: AdminHelper-check
class: beast
capacity:
  market: spot
  strategy: most-available
  fallback: on-demand-after-120s
actions:
  workflow: .github/workflows/crabbox.yml
  job: hydrate
  runnerLabels:
    - crabbox
  runnerVersion: latest
  ephemeral: true
sync:
  delete: true
  checksum: false
  gitSeed: true
  fingerprint: true
  timeout: 15m
  warnFiles: 50000
  warnBytes: 5368709120
  failFiles: 150000
  failBytes: 21474836480
  exclude:
    # keep .git (gitSeed uses it); exclude generated/heavy trees so rsync stays fast.
    #
    # Never exclude a TRACKED source path here. The box gets no .git, so run.sh
    # takes head/tree_hash from the client (crabbox_iter.sh), and that hash covers
    # everything except tasks/ and the output dirs. An exclude over tracked source
    # would make the artifact describe a tree the box never had — the one thing
    # the evidence file exists to rule out. apps/server/data is safe: its only
    # tracked entry is an empty .gitkeep.
    - .cache
    - .turbo
    - dist
    - node_modules
    - target
    - .venv
    - __pycache__
    - "*.pyc"
    - .pytest_cache
    - .ruff_cache
    - coverage
    - apps/web/test-results
    - apps/web/playwright-report
    - apps/web/playwright/.cache
    - apps/server/data
    - backups
    - .crabbox
    - .crabbox-out
    - .dt-xdg
env:
  allow:
    - CI
    - NODE_OPTIONS
ssh:
  user: crabbox
  port: "2222"
  # Ordered fallback ports tried after ssh.port; use [] to disable fallback.
  fallbackPorts:
    - "22"
cache:
  # Optional provider-backed cache volumes. Keep paths outside the synced source tree.
  volumes: []
