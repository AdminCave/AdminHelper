# Bounded container logs: Docker's default json-file driver grows unbounded
# until the disk fills. This anchor caps every service at 5×10 MB and is applied
# below via `logging: *default-logging`. Kept inline (no external file) so this
# compose stays self-contained and distributable on its own.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    environment:
      - POSTGRES_USER=adminhelper
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=adminhelper
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The monitoring DB (adminhelper_monitor) is created by the monitoring
      # service's entrypoint, not a bind-mounted init script — this keeps
      # docker-compose.yml free of repo-file bind mounts (single self-contained
      # file, distributable on its own).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminhelper -d adminhelper"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped
    # No process gains privileges on exec (setuid bits, file capabilities).
    security_opt:
      - no-new-privileges:true
    # Processes: one per connection (max_connections defaults to 100) next to the background workers.
    pids_limit: 512
    # Memory: shared buffers, one backend per connection and the work memory of large sorts.
    mem_limit: 8g
    # KEIN ports:-Mapping - Postgres ist nur intern im Compose-Network erreichbar.
    # In pki (so the ca-issuer reaches it without sharing the default net with frps)
    # + default (server/scheduler/monitoring). No host port either way (1.1).
    networks: [default, pki]

  server:
    image: ${SERVER_IMAGE:-ghcr.io/admincave/adminhelper/server:latest}
    # No host port: the server listens plain-HTTP on the compose network only.
    # The gateway is the single public TLS edge and proxies to server:8080. The
    # missing host port keeps out only the outside; the other services of this
    # network reach server:8080 too. What makes the gateway's X-Client-* identity
    # header trustworthy is the server checking the request's direct peer
    # (app/core/identity.py, _peer_is_gateway), not the socket (ADR 0001 §3.2).
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
      # frps.toml only (non-secret); frps reads it read-only. The frps TLS
      # material now comes from the ca-issuer under the tunnel intermediate (A7),
      # not a server-run FRP CA (D6/F3 — the old frp-pki master volume is gone).
      - frp-config:/app/frp-config
      # Status file of the frps supervisor, read-only (FRPS_STATE_DIR below).
      - frps-state:/app/frps-state:ro
    environment:
      - TZ=${TZ:-Europe/Berlin}
      # Log verbosity for the app + uvicorn loggers (DEBUG/INFO/WARNING/ERROR).
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # No DOMAIN/EXTRA_SANS here: nothing in apps/server reads them. They are
      # the ca-issuer's and the gateway's knobs and are set on those services.
      # Uvicorn worker count. Default 1 (single-worker). Set >1 to scale across
      # CPU cores; requires the `scheduler` service (below) so APScheduler jobs
      # still run exactly once, and Redis for shared rate-limiting (already set).
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      # SQLAlchemy pool PER WORKER. Total connections against Postgres are
      # WEB_CONCURRENCY x (pool + overflow), so these move together with the
      # worker count — .env.example carries that arithmetic.
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # mTLS enforcement (per-route cert-scope check). Default true = enforced
      # (reject protected routes without a valid cert); set false for a permissive
      # window (e.g. a manual first-admin bootstrap). Flipped together with the
      # gateway. scripts/install.sh mints the first cert out-of-band; see docs (Betrieb).
      - MTLS_ENFORCE=${MTLS_ENFORCE:-true}
      # The server stamps <host>:ENROLL_PORT/enroll into every enrollment grant, so it MUST match the
      # gateway's published enroll-plane port below — otherwise agent/desktop enrollment dials a closed
      # port (4.50).
      - ENROLL_PORT=${ENROLL_PORT:-8444}
      - FRP_CONFIG_DIR=/app/frp-config
      - FRPS_STATE_DIR=/app/frps-state
      # The host port compose publishes for frps (below), reported with the supervisor status.
      - FRP_BIND_PORT=${FRP_BIND_PORT:-7000}
      # Postgres
      - DATABASE_URL=postgresql+psycopg://adminhelper:${POSTGRES_PASSWORD}@postgres:5432/adminhelper
      # libpq variables for the entrypoint's pg_isready wait. No PGPASSWORD:
      # pg_isready does not authenticate, and the password already travels in
      # DATABASE_URL. Only the monitoring entrypoint opens a session (psycopg, to
      # create its database) and needs it.
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=adminhelper
      # Monitoring-Proxy
      - MONITOR_SERVICE_URL=http://monitoring:8080
      - MONITOR_API_KEY=${MONITOR_API_KEY:-}
      # IP-Zugangsbeschränkung (leer = kein Filter)
      # Beispiel: ALLOWED_IPS=192.168.1.0/24,10.0.0.5
      - ALLOWED_IPS=${ALLOWED_IPS:-}
      # Wirkt in Compose nicht: TRUSTED_PROXIES ist hier immer gesetzt (siehe unten) und
      # hat Vorrang. Ausserhalb von Compose: true = X-Forwarded-For von jeder Gegenstelle.
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      # The gateway service is always trusted, by its name (the server resolves it every 30 s):
      # the server takes the client address from the X-Forwarded-For the gateway sets.
      # TRUSTED_PROXIES in .env adds further direct peers of the server (addresses, networks or
      # host names), e.g. TRUSTED_PROXIES=192.0.2.10,198.51.100.0/24. A proxy in front of the
      # gateway does not belong there: the gateway does not read its X-Forwarded-For. With
      # TRUSTED_PROXIES always set, TRUST_PROXY_HEADERS above has no effect under compose.
      - TRUSTED_PROXIES=gateway${TRUSTED_PROXIES:+,${TRUSTED_PROXIES}}
      # Redis fuer Rate-Limit ueber mehrere Worker hinweg
      - REDIS_URL=redis://redis:6379/0
      # Audit-Log-Aufbewahrung in Tagen (0 = unbegrenzt); taeglicher Prune-Job.
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-365}
      # Web panel signs out after this many minutes without input in any tab (0 = off).
      - WEB_IDLE_TIMEOUT_MINUTES=${WEB_IDLE_TIMEOUT_MINUTES:-30}
      # Server ends a browser session this many hours after sign-in (0 = off).
      - WEB_SESSION_MAX_HOURS=${WEB_SESSION_MAX_HOURS:-24}
      # SMTP-Relay fuer E-Mail-Benachrichtigungen (Notification-Hub). Leerer
      # SMTP_HOST = E-Mail-Kanal deaktiviert (Outbox-Eintraege scheitern dann und
      # werden nach NOTIFICATION_MAX_ATTEMPTS verworfen). Kein lokaler MTA: auf
      # einen externen Relay zeigen (587 STARTTLS oder 465 SMTPS).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-adminhelper@localhost}
    logging: *default-logging
    restart: unless-stopped
    # No process gains privileges on exec (setuid bits, file capabilities).
    security_opt:
      - no-new-privileges:true
    # Processes and threads: per uvicorn worker (WEB_CONCURRENCY, rule of thumb 2×cores+1, see
    # .env.example) a thread pool of up to 40 and up to eight hook processes. Raise it together
    # with a large WEB_CONCURRENCY.
    pids_limit: 4096
    # Memory: per uvicorn worker an interpreter, its requests and up to eight hook processes.
    mem_limit: 6g
    # TCP-readiness on the uvicorn port. The entrypoint runs `alembic upgrade head` BEFORE uvicorn binds
    # 8080, so a successful connect means migrations are done — lets dependants wait on service_healthy
    # instead of racing Alembic (the gateway otherwise serves 502s to fresh clients) (1.22).
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 48
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Dedicated scheduler process: the SINGLE APScheduler instance. The web
  # workers (server) run uvicorn only and never start the scheduler, so its jobs
  # (outbox drain, cleanups, scheduled-hook reconcile) run exactly once even with
  # WEB_CONCURRENCY > 1. Do NOT scale this service beyond one replica.
  scheduler:
    image: ${SERVER_IMAGE:-ghcr.io/admincave/adminhelper/server:latest}
    environment:
      - RUN_MODE=scheduler
      - TZ=${TZ:-Europe/Berlin}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      # Same pool knobs as the web service: the scheduler holds its own engine.
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - DATABASE_URL=postgresql+psycopg://adminhelper:${POSTGRES_PASSWORD}@postgres:5432/adminhelper
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=adminhelper
      - MONITOR_API_KEY=${MONITOR_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-365}
      - NOTIFICATION_RETENTION_DAYS=${NOTIFICATION_RETENTION_DAYS:-90}
      - NOTIFICATION_MAX_ATTEMPTS=${NOTIFICATION_MAX_ATTEMPTS:-5}
      # The notices about frps supervisor events go out from here.
      - FRPS_STATE_DIR=/app/frps-state
      - FRP_BIND_PORT=${FRP_BIND_PORT:-7000}
      # SMTP: the outbox drain runs here, so the scheduler needs the relay too.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-adminhelper@localhost}
    volumes:
      # Shared DATA_DIR so the auto-generated SECRET_KEY matches the web service.
      - ./data:/app/data
      # Status file of the frps supervisor, read-only (FRPS_STATE_DIR above).
      - frps-state:/app/frps-state:ro
    logging: *default-logging
    restart: unless-stopped
    # No process gains privileges on exec (setuid bits, file capabilities).
    security_opt:
      - no-new-privileges:true
    # Processes and threads: the job thread pools and up to eight hook processes.
    pids_limit: 1024
    # Memory: one interpreter with its jobs and up to eight hook processes.
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/admincave/adminhelper/gateway:latest}
    # The single public TLS/mTLS edge for the HTTP planes (ADR 0001 D11).
    #   :443   data plane  -> server  (mTLS enforced by default: CERT_REQUIRED)
    #   :8444  enroll plane -> ca-issuer (certless, token-gated)
    #   :8445  repo plane   -> static GPG-signed apt/rpm repo (certless, ./repo)
    # TLS material (access-signed leaf + CA bundle) is provisioned by the
    # ca-issuer into the shared gateway-certs volume; the entrypoint waits for it.
    ports:
      - "443:443"
      - "${ENROLL_PORT:-8444}:8444"
      - "${REPO_PORT:-8445}:8445"
    volumes:
      - gateway-certs:/etc/nginx/certs:ro
      # Agent package repo the updater populates host-side (empty/absent → 404).
      - ./repo:/usr/share/nginx/repo:ro
    environment:
      - TZ=${TZ:-Europe/Berlin}
      # Default true → data plane :443 is CERT_REQUIRED (ssl_verify_client on);
      # false is permissive, only for a manual first-admin bootstrap. Flip
      # together with the server's MTLS_ENFORCE. scripts/install.sh sets up the
      # first admin's cert out-of-band, so a fresh install is enforced from the
      # start (see docs/Betrieb).
      - MTLS_ENFORCE=${MTLS_ENFORCE:-true}
    # A listener on 127.0.0.1 that only nginx.conf knows: healthy once nginx has loaded its
    # whole configuration. start_period covers the entrypoint's wait of up to 120 s for the
    # TLS material from the ca-issuer.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 150s
    logging: *default-logging
    restart: unless-stopped
    # The nginx master runs as root and starts its workers as the image's user nginx, which
    # keeps no capability. The master's: CHOWN to hand its temp directories under
    # /var/cache/nginx to that user; SETUID and SETGID to switch the workers to it;
    # DAC_OVERRIDE to read gateway.key, which the ca-issuer writes 0600 under its own UID. No
    # KILL: on QUIT, the image's stop signal, the master tells its workers to stop through a
    # channel of its own, not by signal.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    # Ports 443, 8444 and 8445 inside without NET_BIND_SERVICE: every port of the container's
    # own network namespace is open to unprivileged processes. Docker's default since 20.10,
    # set here so that it does not depend on the engine (as for frps).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    # No process gains privileges on exec (setuid bits, file capabilities).
    security_opt:
      - no-new-privileges:true
    # Processes: the nginx master and one worker per core (worker_processes auto).
    pids_limit: 512
    # Memory: the nginx master and its workers with their buffers per connection.
    mem_limit: 1g
    depends_on:
      # nginx resolves the upstream names at startup, so both must already exist.
      ca-issuer:
        condition: service_started
      server:
        condition: service_healthy
    # default to reach server:8080; pki to reach ca-issuer:8090 (1.1).
    networks: [default, pki]

  ca-issuer:
    image: ${CA_ISSUER_IMAGE:-ghcr.io/admincave/adminhelper/ca-issuer:latest}
    # Internal-only PKI plane: the single signing capability (D6). Reachable only
    # from its peers on the `pki` network below, the gateway (its enroll listener)
    # and postgres — ENFORCED by that network, not merely asserted (1.1); never from
    # frps, the other services of the default net, or the host (no port mapping).
    expose:
      - "8090"
    volumes:
      # The PKI hierarchy (Root + intermediates) — issuer-only. NEVER mounted
      # into the gateway or frps (the signing keys stay here, D6).
      - ca-pki:/app/data
      # Outbound drop for the gateway's TLS material (leaf + key + CA bundle).
      - gateway-certs:/app/gateway-certs
      # Outbound drop for the frps TLS material (tunnel-signed leaf + key + chain).
      - frps-certs:/app/frps-certs
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - DOMAIN=${DOMAIN:-localhost}
      - EXTRA_SANS=${EXTRA_SANS:-}
      # Encrypts the cold Root key at rest (D7). Only the first boot needs it, to create
      # the hierarchy. Set via ./scripts/init-secrets.sh; keep it OUT of backups. It
      # arrives as a file (the secret ca_root_passphrase, top-level `secrets:` below),
      # not as an environment variable, so it stays out of the container's environment
      # (docker inspect, /proc/<pid>/environ). After the first boot the value in .env may
      # be empty: `docker compose up -d` then recreates the ca-issuer (label below) and
      # the file is gone. The line CA_ROOT_PASSPHRASE= has to stay: without it
      # `docker compose up` aborts (a secret with the source `environment` needs
      # Compose v2.6.0 or later).
      - CA_ROOT_PASSPHRASE_FILE=/run/secrets/ca_root_passphrase
      - CA_GATEWAY_CERT_DIR=/app/gateway-certs
      # frps server cert under the tunnel intermediate (A7). SERVER_ADDR must match
      # the public frps address frpc connects to (the DB's server_addr); defaults
      # to DOMAIN.
      - CA_FRPS_CERT_DIR=/app/frps-certs
      - CA_FRPS_SERVER_ADDR=${FRP_SERVER_ADDR:-${DOMAIN:-localhost}}
      # Extra SANs for the frps leaf; empty falls back to EXTRA_SANS (the gateway's).
      - CA_FRPS_EXTRA_SANS=${CA_FRPS_EXTRA_SANS:-}
      # Works on the server's tables in the shared DB: consumes enrollment tokens and
      # keeps the certificate register (device lines, issued certificates); it reads
      # identity revocations and never mints a token.
      - DATABASE_URL=postgresql+psycopg://adminhelper:${POSTGRES_PASSWORD}@postgres:5432/adminhelper
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz').read()"
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped
    # No process gains privileges on exec (setuid bits, file capabilities).
    security_opt:
      - no-new-privileges:true
    # Processes and threads: one uvicorn process and its thread pool.
    pids_limit: 512
    # Memory: one uvicorn process that signs certificates and holds no large data.
    mem_limit: 512m
    # Mounted as /run/secrets/ca_root_passphrase (CA_ROOT_PASSPHRASE_FILE above).
    secrets: [ca_root_passphrase]
    # Compose leaves a secret's content out of the hash it compares on `up`, so emptying
    # the value alone would keep the container and the old file in it. This label holds
    # only whether a value is set (never the value): emptying it changes the label, and
    # `up -d` recreates the container without the file.
    labels:
      com.admincave.adminhelper.ca-root-passphrase-present: "${CA_ROOT_PASSPHRASE:+yes}"
    depends_on:
      postgres:
        condition: service_healthy
      # The server's Alembic migration creates the tables this service works on, and the
      # server turns healthy only after `alembic upgrade head` (its healthcheck above). Waiting
      # on service_healthy keeps /enroll and /renew from racing Alembic into a 500 on a missing
      # table (R-0288). depends_on needs no shared network; the ca-issuer stays on pki only.
      server:
        condition: service_healthy
    # ONLY pki — deliberately NOT on the default net, so no other service (above all
    # the internet-facing frps) can reach :8090 to forge the gateway's mTLS headers
    # and mint certs. gateway + postgres are its only pki peers (1.1).
    networks: [pki]

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    logging: *default-logging
    restart: unless-stopped
    # No process gains privileges on exec (setuid bits, file capabilities).
    security_opt:
      - no-new-privileges:true
    # Processes and threads: redis-server and its few background threads; with persistence off
    # it forks no snapshot child.
    pids_limit: 256
    # Memory: rate-limit counters and the notification pub/sub; nothing is persisted.
    mem_limit: 512m
    healthcheck:
      # A wedged-but-running process shows unhealthy (not just Up); dependants that
      # wait on service_healthy then hold until redis actually answers (4.49).
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  frps:
    # frps under a supervisor that starts it only from a checked copy of the configuration
    # and takes over changes itself (apps/frps). The image pins the frps base image to
    # match the bundled frpc (FRP_VERSION in .github/workflows/*.yml). Keep both in
    # lockstep — a floating version can jump the server ahead of the client and break
    # the tunnel (e.g. wire-protocol changes).
    image: ${FRPS_IMAGE:-ghcr.io/admincave/adminhelper/frps:latest}
    ports:
      # Container side bound to the SAME var: frps.toml's bindPort is generated by the
      # server from FrpServerConfig.bind_port (the FRP-config UI), so FRP_BIND_PORT must
      # equal that DB value — otherwise frps listens on one port and the mapping on
      # another and every tunnel breaks (1.23).
      - "${FRP_BIND_PORT:-7000}:${FRP_BIND_PORT:-7000}"
      - "${FRP_HTTPS_PORT:-7443}:443"
    volumes:
      # The frps.toml the server writes; nocopy: the volume holds only what the server writes.
      - type: volume
        source: frp-config
        target: /etc/frp
        read_only: true
        volume:
          nocopy: true
      # TLS material under the tunnel intermediate, provisioned by the ca-issuer
      # (A7) — the CA private key never reaches this internet-facing container.
      - frps-certs:/etc/frp-pki:ro
      # The supervisor's status file; the server and the scheduler read it.
      - frps-state:/var/lib/frps-state
      # The checked copy frps runs from, token and key included: mounted here alone.
      - frps-active:/var/lib/frps-active
    environment:
      - FRP_BIND_PORT=${FRP_BIND_PORT:-7000}
    # The supervisor runs as root and starts frps as the image's user frps, which keeps no
    # capability, and the requests to the dashboard of frps as the image's user frps-fetch.
    # The supervisor's: DAC_OVERRIDE to read frps.toml and frps.key, which the server and the
    # ca-issuer write 0600 under their own UID; SETUID and SETGID to switch to frps and to
    # frps-fetch (su-exec); KILL to stop frps across the UID, and on TERM the requests under
    # way across theirs (on_signal).
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, SETUID, SETGID, KILL]
    # Port 443 inside without NET_BIND_SERVICE: every port of the container's own network
    # namespace is open to unprivileged processes. Docker's default since 20.10, set here so
    # that it does not depend on the engine: an engine or a kernel that cannot set it fails
    # at `up`, rather than frps at its bind.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    # No process gains privileges on exec (setuid bits, file capabilities).
    security_opt:
      - no-new-privileges:true
    # A TERM while the supervisor stops frps for a change waits for frps a second time,
    # each up to FRPS_STOP_SECONDS (10 s): Docker's KILL must not come first.
    stop_grace_period: 30s
    healthcheck:
      # Healthy while waiting, running or stopped; reads the status file only.
      test: ["CMD", "/bin/sh", "/usr/local/bin/frps-supervisor.sh", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    # Processes and threads: the supervisor, frps with the threads of the Go runtime, and the
    # dashboard requests under way.
    pids_limit: 512
    # Memory: the buffers of frps grow with the tunnels and their connections.
    mem_limit: 2g
    depends_on:
      server:
        condition: service_started
      ca-issuer:
        condition: service_healthy
    # ONLY frpedge — the internet-facing tunnel edge gets its own network, off the
    # default net, so a compromised frps (foreign image, RCE) can't reach the auth-less
    # redis:6379 or victoria:8428 to inject SSE, wipe rate-limit state, or forge metrics.
    # frps needs no other service at runtime — just its ports, depends_on, and its
    # volumes, all network-independent (3.28, second line of defense after 1.1).
    networks: [frpedge]

  monitoring:
    image: ${MONITORING_IMAGE:-ghcr.io/admincave/adminhelper/monitoring:latest}
    # Internal-only (like postgres/redis/victoria): agents push metrics via the
    # server's public 443 proxy at /api/monitoring/agent/{id}/report, so the
    # monitoring admin API + /docs are never reachable directly from the host.
    expose:
      - "8080"
    volumes:
      - monitoring-data:/app/data
    environment:
      - TZ=${TZ:-Europe/Berlin}
      # Log verbosity for the app + uvicorn loggers (DEBUG/INFO/WARNING/ERROR).
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VICTORIA_METRICS_URL=http://victoria:8428
      - MONITOR_API_KEY=${MONITOR_API_KEY:-}
      # Alert-log retention (days). Independent of the VictoriaMetrics metric
      # retention below (VM_RETENTION) — changing one does NOT change the other.
      - ALERT_LOG_RETENTION_DAYS=${ALERT_LOG_RETENTION_DAYS:-90}
      # SMTP: e-mail alert rules send through the hub's relay unless a rule sets its own.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-adminhelper@localhost}
      # Notification hub: push check-status transitions to the server, which
      # resolves which users to notify (best-effort; auth via MONITOR_API_KEY as
      # X-Internal-Key). No depends_on — the push tolerates the server being down
      # and a hard dependency would be circular (server proxies to monitoring).
      # Plaintext http is deliberate on the internal compose network; ALLOW_INSECURE_HUB
      # acknowledges it so config.py doesn't warn on every start (3.74).
      - SERVER_HUB_URL=http://server:8080
      - ALLOW_INSECURE_HUB=1
      # Postgres
      - DATABASE_URL=postgresql+psycopg://adminhelper:${POSTGRES_PASSWORD}@postgres:5432/adminhelper_monitor
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=adminhelper
      - PGPASSWORD=${POSTGRES_PASSWORD}
    logging: *default-logging
    restart: unless-stopped
    # No process gains privileges on exec (setuid bits, file capabilities).
    security_opt:
      - no-new-privileges:true
    # Processes and threads: the check scheduler's pool of 30, one ping process per running ping
    # check, and uvicorn's thread pool.
    pids_limit: 1024
    # Memory: the check scheduler, the ping processes and uvicorn.
    mem_limit: 4g
    # The ping checks run `ping` as the image's user app. Under no-new-privileges a setuid or
    # file-capability ping gains nothing and opens an ICMP datagram socket, which the kernel
    # grants only to the groups in this range. Docker's default, set here so that it does not
    # depend on the engine (like frps's sysctl).
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    healthcheck:
      # A wedged-but-running monitoring shows unhealthy, not just Up (4.49). An HTTP GET on
      # /health (app.main), not a TCP connect: the kernel completes a connect from the listen
      # backlog even while the process hangs, only a running process answers the request.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      victoria:
        condition: service_started
      postgres:
        condition: service_healthy

  victoria:
    image: victoriametrics/victoria-metrics:v1.144.0@sha256:dc030542eb0cd262287c9ec32e5867f8dcccc0efd5906c10f7fc8176c53d34d7
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - victoria-data:/victoria-metrics-data
    command:
      # Metric retention. Independent of ALERT_LOG_RETENTION_DAYS on the
      # monitoring service (alert-log rows in Postgres) — two separate knobs
      # that do not sync.
      - "-retentionPeriod=${VM_RETENTION:-90d}"
      - "-storageDataPath=/victoria-metrics-data"
    expose:
      - "8428"
    healthcheck:
      # /health answers once the storage is open; opening a large data set takes a while,
      # hence the longer start period and more retries than the other services.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped
    # No process gains privileges on exec (setuid bits, file capabilities).
    security_opt:
      - no-new-privileges:true
    # Threads: one Go process whose threads grow with the cores and the queries under way.
    pids_limit: 1024
    # Memory: VictoriaMetrics sizes its caches to 60% of the memory it sees: of this limit when it is
    # below the host's RAM, otherwise of the RAM.
    mem_limit: 8g

  # Optionaler Postgres-Backup-Container.
  # Aktivieren mit: docker compose up -d pg-backup
  # Schreibt taeglich pg_dump-Backups beider DBs nach ./backups/.
  # Retention 7 Tage rolling.
  #
  # pg-backup:
  #   image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
  #   volumes:
  #     - ./backups:/backups
  #     - ./scripts/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
  #   environment:
  #     - PGHOST=postgres
  #     - PGUSER=adminhelper
  #     - PGPASSWORD=${POSTGRES_PASSWORD}
  #     - BACKUP_DIR=/backups
  #     - RETENTION_DAYS=7
  #   entrypoint: ["sh", "-c", "while true; do /usr/local/bin/pg-backup.sh; sleep 86400; done"]
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

# Three networks. `pki` (internal) carries gateway↔ca-issuer↔postgres so the PKI signing
# plane is NOT on the shared default net — a compromised internet-facing frps could
# otherwise reach ca-issuer:8090 and forge the gateway's mTLS headers to /renew, minting
# client certs (1.1). frps sits alone on `frpedge`; everything else is on `default`.
networks:
  default: {}
  pki:
    internal: true
  # The internet-facing frps tunnel edge, fenced off the internal default net so a
  # compromised frps can't reach the auth-less redis/victoria (3.28). Not `internal`:
  # frps IS the public edge and needs its published ports.
  # No IP masquerading: frps only accepts connections, and its published ports keep
  # working. It needs no outbound traffic, and the supervisor admits no entries that
  # would make it connect out (server plugins; TOP_KEYS and the single table
  # [transport.tls] in frps-supervisor.sh). Packets frps sends itself leave the host
  # with the container's address, and Docker 28 and later drop packets addressed to a
  # container from outside its network, answers included (unless the daemon runs with
  # allow-direct-routing or the network in gateway mode nat-unprotected or routed): no
  # connection beyond the host comes about. Services of the host itself stay reachable
  # from this network.
  frpedge:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  frp-config:
  # PKI hierarchy of the ca-issuer (Root + intermediates) — the backup crown
  # jewel (ADR 0001 §5). Isolated from the gateway/frps.
  ca-pki:
  # Gateway TLS material the issuer provisions and the gateway consumes (ro).
  gateway-certs:
  # frps TLS material the issuer provisions (tunnel-signed) and frps consumes (ro).
  frps-certs:
  # The frps supervisor's status file (frps writes, server and scheduler read) and the
  # checked copy frps runs from (frps only). Not backed up: the supervisor rewrites the
  # status at every poll and takes the copy again from frp-config and frps-certs.
  frps-state:
  frps-active:
  monitoring-data:
  victoria-data:
  postgres-data:

# The CA root passphrase for the ca-issuer. Compose takes the value from CA_ROOT_PASSPHRASE
# in the environment or the project's .env and writes it into the container as
# /run/secrets/ca_root_passphrase; an empty value creates no file (see the label of the
# ca-issuer for what happens to a container that already has one).
secrets:
  ca_root_passphrase:
    environment: CA_ROOT_PASSPHRASE
