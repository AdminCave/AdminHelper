# Test overlay on docker-compose.yml. Layered ON TOP of the production compose
# (never a standalone copy) so the tests exercise the real shipped topology — a
# separate file would drift. Used by scripts/tests/*.sh via
#   docker compose -f docker-compose.yml -f docker-compose.test.yml ...
#
# It does four things, all test-only:
#   - build the first-party images from THIS checkout (so tests run the
#     current code, not a published tag) under throwaway local tags;
#   - publish the gateway on high, per-run host ports (ITEST_*_PORT) instead of
#     the fixed 443/8444 — `!override` REPLACES the base ports (a plain merge
#     keeps 443 and collides with a real stack or a parallel run) — on the host
#     address ITEST_BIND_IP if set, else with no address, as the base does;
#   - publish Postgres and Redis on 127.0.0.1 only (ITEST_PG_PORT,
#     ITEST_REDIS_PORT), for the tests that need a real database or Redis and run
#     on the host (stack_pytest.sh). Production keeps them network-internal;
#   - swap the ./data host bind of the server and the scheduler for the named
#     volume test-data, so `down -v` cleans it and no container-UID-owned files
#     are left in the repo; the two share it as they share ./data in production.
#
# frps keeps the fixed host ports 7000/7443 of the base, as the gateway keeps
# its enroll and repo ports below: the desktop E2E connects to localhost:7000
# and the multibox server box serves the tunnel boxes on :7000 (only the stack
# test asks compose for the published port). Only stack b of two side by side
# moves them: its .env sets the base's FRP_BIND_PORT/FRP_HTTPS_PORT to 7001/7444
# (lib_e2e_stack.sh, e2e_init <mtls> b).
services:
  # Loopback only: Redis has no auth at all, and nothing but tests on the same
  # host needs either. The base defines no ports for them, so a plain list adds these.
  postgres:
    ports:
      - "127.0.0.1:${ITEST_PG_PORT:-15432}:5432"

  redis:
    ports:
      - "127.0.0.1:${ITEST_REDIS_PORT:-16379}:6379"

  server:
    image: adminhelper-test/server:latest
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - test-data:/app/data

  # The scheduler runs the SAME image as the server (only a different command), but
  # docker-compose.yml pins it to the ghcr.io tag. Point it at the locally-built tag
  # too, else a full `docker compose up` (e.g. from restore.sh) tries to pull the
  # unavailable image and the whole up fails (6.64).
  scheduler:
    image: adminhelper-test/server:latest
    volumes:
      - test-data:/app/data

  # db-init runs the server image too (app.db_roles), and the ghcr.io tag knows no such module.
  db-init:
    image: adminhelper-test/server:latest

  gateway:
    image: adminhelper-test/gateway:latest
    build:
      context: apps/gateway
    # ITEST_BIND_IP: a loopback address per stack lets two stacks side by side each
    # hold 8444 (lib_e2e_stack.sh, e2e_init <mtls> a|b).
    ports: !override
      - "${ITEST_BIND_IP:+${ITEST_BIND_IP}:}${ITEST_HTTPS_PORT:-18443}:443"
      # Enroll plane stays on 8444: the desktop app derives it as <host>:8444.
      - "${ITEST_BIND_IP:+${ITEST_BIND_IP}:}${ITEST_ENROLL_PORT:-8444}:8444"
      # Repo plane, so integration_stack_test can assert its path filtering (6.63/6.125).
      - "${ITEST_BIND_IP:+${ITEST_BIND_IP}:}${ITEST_REPO_PORT:-8445}:8445"

  ca-issuer:
    image: adminhelper-test/ca-issuer:latest
    build:
      context: apps/ca-issuer

  # The supervisor of this checkout, not a published tag.
  frps:
    image: adminhelper-test/frps:latest
    build:
      context: apps/frps

  # Built locally too, so the monitoring-pipeline tests (agent push -> check
  # evaluation) run THIS checkout's monitoring service, not a published tag.
  monitoring:
    image: adminhelper-test/monitoring:latest
    build:
      context: apps/monitoring

volumes:
  test-data:
