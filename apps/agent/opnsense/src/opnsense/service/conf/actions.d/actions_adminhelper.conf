#
# start, stop and restart act on the tunnel client alone, as the services page asks; the switch of
# the settings page goes through reconfigure. faststop is quiet and exits 0 on a stopped client;
# onestatus answers whatever the rcvar says. No action takes a token: the agent is registered in a
# shell.

[start]
command: /usr/sbin/service adminhelper_frpc start
parameters:
type: script
message: Starting the AdminHelper tunnel client

[stop]
command: /usr/sbin/service adminhelper_frpc faststop
parameters:
type: script
message: Stopping the AdminHelper tunnel client

[restart]
command: /usr/sbin/service adminhelper_frpc restart
parameters:
type: script
message: Restarting the AdminHelper tunnel client

[status]
command: /usr/sbin/service adminhelper_frpc onestatus; exit 0
parameters:
type: script_output
message: Requesting the AdminHelper tunnel client status

[reconfigure]
command: /usr/local/opnsense/scripts/OPNsense/AdminHelper/reconfigure.sh
parameters: %s
type: script
message: Turning AdminHelper %s

[info]
command: /usr/local/opnsense/scripts/OPNsense/AdminHelper/info.php
parameters:
type: script_output
message: Requesting the AdminHelper agent state
