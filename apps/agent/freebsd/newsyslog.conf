# Installed as /usr/local/etc/newsyslog.conf.d/adminhelper.conf. Rotates frpc's log at 1000 KB,
# keeps seven bzip2 archives at mode 0600 and sends SIGHUP to daemon(8) (adminhelper_frpc's
# pidfile), which then reopens the file.
# logfilename                  [owner:group]  mode count size when flags [/pid_file]
/var/log/adminhelper/frpc.log  root:wheel     600  7     1000 *    J     /var/run/adminhelper_frpc.pid
