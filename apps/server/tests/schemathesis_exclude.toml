# Operationen, die der schema-getriebene Fuzzer NICHT anfasst (tests/test_schemathesis.py).
#
# Ein Eintrag ist eine Entscheidung mit Grund und Wiedervorlage, nie ein stilles "-x"
# im Skript: ein Fund, der hier steht, ist einer, den niemand mehr ansieht. Echte
# Funde gehoeren als eigene Zeile in die Roadmap, nicht in diese Datei.
#
# HERKUNFT: Laeufe vom 2026-09-18 und 2026-09-21 gegen die Lane-eigene DB, mit der
# ausgelieferten Beispielzahl (AH_SCHEMATHESIS_EXAMPLES=5) und vier Auth-Kontexten.
# Jeder Grund hier stammt aus einem Lauf, nicht aus einer Vermutung — eine geborgte
# Begruendung war schon zweimal ein Review-Blocker.
#
# Bis zum 2026-09-21 nahm diese Datei OPERATIONEN aus dem Lauf, nicht Checks. Das
# war der schwerere Fehler: 17 Eintraege standen nur wegen negative_data_rejection
# da und haben damit auch not_a_server_error stummgeschaltet — ausgerechnet auf den
# Schreibrouten. Nach der Umstellung auf Check-Granularitaet kamen 19 Treffer zum
# Vorschein, darunter zwei bis dahin unbekannte Produktfehler (der Tag-Validator
# unten, und ForeignKeyViolation auf POST /api/connections).
#
#   operation_id  die Id aus dem OpenAPI-Schema (die App setzt auf jeder Route eine)
#   checks        welche Checks fuer diese Operation abgewaehlt werden. Die Route
#                 ANTWORTET, ein Check hat an der Antwort etwas auszusetzen. Die Operation
#                 bleibt im Lauf: alle nicht genannten Checks greifen weiter. Ein
#                 Ausschluss der GANZEN Operation (kein checks-Feld) nimmt ihr auch
#                 not_a_server_error — und damit die Klasse Fehler, um die es hier
#                 am meisten geht.
#   raises        statt checks: der Aufruf selbst stirbt an einer ungefangenen
#                 Exception, bevor eine Response entsteht. Dann kann kein Check
#                 greifen, und nur hier ist ein Ausschluss der GANZEN Operation
#                 ehrlich — jeder dieser Eintraege ist ein echter Produktfehler.
#   reason        warum diese Checks hier heute nichts beitragen
#   until         woran die Wiedervorlage haengt

#
# VOLLSTAENDIGKEIT DER PAGINIERUNGS-KLASSE (2026-09-22): Das OpenAPI-Schema wurde einmal
# statisch nach allen Integer-Parametern OHNE `maximum` durchsucht — das ist genau die Menge,
# die der Fuzzer bis 2**63 und darueber treiben kann. Neun Treffer im Server; acht stehen
# unten (`user_id`/`key_id` als Pfadparameter, `offset` auf audit, connections, hooks,
# notifications, servers). Der neunte, `gen_visitor_toml_api_frp_generate_visitor_toml_get`
# (`user_id` als Query), steht bewusst NICHT hier: nachgestellt antwortet er bei 2**31-1 und
# bei 2**63 gleichermassen mit 404, der Wert erreicht keinen ueberlaufenden Vergleich.
# Die Suche deckt Query- und Pfadparameter ab, NICHT Integer-Felder in Request-Bodies —
# fuer die steht bisher nur der belegte Fall `mark_read_api_notifications_read_post`.

[[exclude]]
operation_id = "delete_api_key_api_api_keys__key_id__delete"
raises = true
# DELETE /api/api-keys/{key_id}
reason = "not_a_server_error — key_id ist ein unbegrenzter int, derselbe NumericValueOutOfRange-Pfad wie DELETE/PUT /api/users. Der Treffer erschien im Lauf als Schema-Abweichung, weil der abgebrochene Transaktionszustand das Replay stoerte — die Ursache ist der Ueberlauf. Beleg, dass die Klasse ueber /api/users hinausgeht"
until = "Roadmap: int-Pfadparameter begrenzen"
# Der Aufruf stirbt an einer ungefangenen Exception (NumericValueOutOfRange (key_id > 2**31)), bevor eine
# Response entsteht — kein Check kann hier greifen, deshalb die ganze Operation.

