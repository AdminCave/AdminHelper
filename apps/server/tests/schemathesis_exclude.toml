[[exclude]]
operation_id = "notification_stream_api_notifications_stream_get"
raises = true
# GET /api/notifications/stream
reason = "SSE-Stream, in-process nicht fuzzbar. authenticate_stream_user oeffnet absichtlich eine eigene, sofort geschlossene SessionLocal() statt Depends(get_db) (eine SSE-Antwort lebt Minuten bis Stunden und darf keine Pool-Verbindung halten); der get_db-Override der Fixture api_db erreicht diese Sitzung nicht. Kette: stream.py:70 authenticate_stream_user -> auth.py:86 _get_user_from_token -> die Engine aus dem Fallback config.py:56 (localhost:5432). Gemessen 2026-09-25, Kontext admin_jwt, drei Umgebungen: auf der Box (DATABASE_URL leer, Test-DB aus testcontainers) stirbt der Aufruf an einer ungefangenen OperationalError, deterministisch in zwei Wochenlaeufen und zwei Retries; auf Dev/CI (DATABASE_URL auf der Test-DB) kommt 401, weil die Sitzung den Admin der offenen Test-Transaktion nicht sieht — gruen aus dem falschen Grund, der authentifizierte Pfad wurde dort nie gefuzzt; mit richtig gebundener Sitzung kommt 200 und ein Stream ohne Ende, ReadTimeout nach 10 s im schemathesis-Transport. Der Ausschluss gilt fuer alle vier Kontexte, weil das Format nur die Operation kennt (292 -> 288 Faelle): read_key, read_write_key und internal_key senden kein Bearer-Token, dort antwortet die Route ohne Datenbankzugriff mit 401 (stream.py:69-70). Abgedeckt bleibt: der 401-Pfad ohne Token in tests/test_stream.py::TestStreamAuth, die Re-Auth in TestStreamReauth, die Live-Frames in scripts/tests/sse_push_e2e.sh und desktop_e2e_sse_push.sh"
until = "solange der In-Process-Transport eine Streaming-Antwort bis zum Ende liest"

