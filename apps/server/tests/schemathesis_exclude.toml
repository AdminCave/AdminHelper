# GET /api/hooks
reason = "HTTP 500 bei `offset` jenseits von 2**63-1: der Parameter ist als `Query(0, ge=0)` deklariert — untere Schranke ohne obere — und geht ungeprueft in LIMIT/OFFSET. Der Treiber lehnt ihn ab (NumericValueOutOfRange), ungefangen, es entsteht keine Response. Statisch ueber das OpenAPI-Schema gefunden (alle Integer-Parameter ohne `maximum`) und je Route nachgestellt: offset=2**63-1 -> HTTP 200, offset=2**63 -> DataError vor der Antwort. Nicht einzeln erfuzzt, sondern vorsorglich gelistet: derselbe Fehler, denselben Weg hinein. Zusaetzlich, aus dem Erstlauf: negative_data_rejection — der Treffer betrifft die HEADER- und QUERY-Mutation, nicht den Body: der Check laesst den Authorization-Header weg und erwartet eine Ablehnung, aber die Auth-Header setzt die Fixture von aussen ueber headers=, der Request geht also authentifiziert raus. Dazu ignoriert FastAPI unbekannte Query-Parameter. Gleiche blinde Stelle wie bei ignored_auth: der Check kann die von aussen gesetzten Credentials nicht sehen"
until = "Roadmap R-0052: obere Schranke auf den Paginierungs-Parametern beider Dienste"

