raises = true
# GET /api/monitoring/{path}
reason = "Catch-all des Monitoring-Proxys. Alle vier teilen sich EINEN prozessweiten httpx-Client (monitoring_proxy/router.py:42), den der Lifespan-Shutdown schliesst; der schemathesis-Transport faehrt den Lifespan pro Prozess einmal hoch und wieder herunter, und wer danach drankommt, stirbt im Transport mit `RuntimeError: Cannot send a request, as the client has been closed` — ungefangen, vor jeder Response. Gemessen 2026-09-22, nachdem die behobenen Ausschluesse gefallen waren: alle vier Methoden sind in demselben Lauf einzeln mit genau diesem RuntimeError gefallen. Es ist trotzdem EINE Ursache, ein Client und ein Lifespan — nicht vier Routen. In drei Laeufen davor kamen dieselben Operationen vor dem Shutdown dran und waren gruen: das ist eine Aussage ueber die Sammelreihenfolge, nicht ueber die Route"
until = "Stufe 8c (Cross-Service-Vertraege) oder ein Stub fuer den Proxy-Client"

