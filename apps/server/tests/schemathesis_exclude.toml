# Operationen, die der schema-getriebene Fuzzer NICHT anfasst (tests/test_schemathesis.py).
#
# Ein Eintrag ist eine Entscheidung mit Grund und Wiedervorlage, nie ein stilles "-x"
# im Skript: ein Fund, der hier steht, ist einer, den niemand mehr ansieht. Echte
# Funde gehoeren als eigene Zeile in die Roadmap, nicht in diese Datei.
#
# HERKUNFT: Lauf 2026-09-18 gegen die Lane-eigene DB, AH_SCHEMATHESIS_EXAMPLES=5
# (die ausgelieferte Zahl, nicht 1), alle fuenf Auth-Kontexte, ohne Ausschluesse:
# 35 failed / 355 passed ueber 23 Operationen. Klassen: 14x negative_data_rejection,
# 7x ignored_auth, 4x response_schema_conformance, dazu die 500er unten.
#
# Die Liste ist weit ueber der Ledger-Grenze von fuenf Ausschluessen je Dienst
# -> Task T3 steht auf [?]. Zwei Hebel wuerden sie kurz machen, beide brauchen
# Kevins Entscheidung (Details im Ledger):
#   1. `negative_data_rejection` fuer die Python-Dienste abschalten (14 Treffer)
#   2. `ignored_auth` fuer die Nicht-JWT-Kontexte per excluded_checks abwaehlen,
#      statt ganze Operationen zu streichen (7 Treffer) — der Check wertet nur
#      schema-deklarierte Security-Parameter und ist fuer X-API-Key blind
#
#   operation_id  die Id aus dem OpenAPI-Schema (die App setzt auf jeder Route eine)
#   reason        warum diese Operation heute nicht gefuzzt wird
#   until         woran die Wiedervorlage haengt

[[exclude]]
operation_id = "delete_api_key_api_api_keys__key_id__delete"
# DELETE /api/api-keys/{key_id}
reason = "not_a_server_error — key_id ist ein unbegrenzter int, derselbe NumericValueOutOfRange-Pfad wie DELETE/PUT /api/users. Der Treffer erschien im Lauf als Schema-Abweichung, weil der abgebrochene Transaktionszustand das Replay stoerte — die Ursache ist der Ueberlauf. Beleg, dass die Klasse ueber /api/users hinausgeht"
until = "Roadmap: int-Pfadparameter begrenzen"

[[exclude]]
operation_id = "delete_user_api_users__user_id__delete"
# DELETE /api/users/{user_id}
reason = "not_a_server_error — HTTP 500: user_id ist ein unbegrenzter int, ab 2**31 laeuft die Postgres-Abfrage in NumericValueOutOfRange, ungefangen. ECHTER PRODUKTFEHLER, unabhaengig reproduziert (2147483647 -> 404, 2147483648 -> 500)"
until = "Roadmap: int-Pfadparameter begrenzen"

[[exclude]]
operation_id = "list_api_keys_api_api_keys_get"
# GET /api/api-keys
reason = "response_schema_conformance — created_at ist eine tz-naive DateTime-Spalte (Konvention F7: naiv, aber UTC). Pydantic serialisiert sie ohne Offset, OpenAPI format:date-time ist RFC 3339 und verlangt einen ⇒ jedes datetime-Feld in einem typisierten response_model bricht den deklarierten Vertrag. Gleiche Klasse wie der 422-Body von connections/import"
until = "Roadmap: tz-aware Serialisierung oder Schema auf tz-naiv stellen"

