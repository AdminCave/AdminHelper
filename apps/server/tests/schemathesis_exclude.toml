# Operationen, die der schema-getriebene Fuzzer NICHT anfasst (tests/test_schemathesis.py).
#
# Ein Eintrag ist eine Entscheidung mit Grund und Wiedervorlage, nie ein stilles "-x"
# im Skript: ein Fund, der hier steht, ist einer, den niemand mehr ansieht. Echte
# Funde gehoeren als eigene Zeile in die Roadmap, nicht in diese Datei.
#
# HERKUNFT: Laeufe vom 2026-09-18 und 2026-09-21 gegen die Lane-eigene DB, mit der
# ausgelieferten Beispielzahl (AH_SCHEMATHESIS_EXAMPLES=5) und vier Auth-Kontexten.
# Jeder Grund hier stammt aus einem Lauf, nicht aus einer Vermutung — eine geborgte
# Begruendung war schon zweimal ein Review-Blocker.
#
# Bis zum 2026-09-21 nahm diese Datei OPERATIONEN aus dem Lauf, nicht Checks. Das
# war der schwerere Fehler: 17 Eintraege standen nur wegen negative_data_rejection
# da und haben damit auch not_a_server_error stummgeschaltet — ausgerechnet auf den
# Schreibrouten. Nach der Umstellung auf Check-Granularitaet kamen 19 Treffer zum
# Vorschein, darunter zwei bis dahin unbekannte Produktfehler (der Tag-Validator
# unten, und ForeignKeyViolation auf POST /api/connections).
#
#   operation_id  die Id aus dem OpenAPI-Schema (die App setzt auf jeder Route eine)
#   checks        welche Checks fuer diese Operation abgewaehlt werden. Die Route
#                 ANTWORTET, ein Check hat an der Antwort etwas auszusetzen. Die Operation
#                 bleibt im Lauf: alle nicht genannten Checks greifen weiter. Ein
#                 Ausschluss der GANZEN Operation (kein checks-Feld) nimmt ihr auch
#                 not_a_server_error — und damit die Klasse Fehler, um die es hier
#                 am meisten geht.
#   raises        statt checks: der Aufruf selbst stirbt an einer ungefangenen
#                 Exception, bevor eine Response entsteht. Dann kann kein Check
#                 greifen, und nur hier ist ein Ausschluss der GANZEN Operation
#                 ehrlich. Meist ist das ein echter Produktfehler; die Ausnahmen
#                 sind Eigenschaften der In-Process-Fixture (der SSE-Stream ohne
#                 Ende), und ihre reason sagt das.
#   reason        warum diese Checks hier heute nichts beitragen
#   until         woran die Wiedervorlage haengt

#
# ZEITSTEMPEL (2026-10-06, R-0064): Die drei response_schema_conformance-Eintraege wegen
# tz-naiver created_at-Werte sind behoben (UtcDatetime schreibt UTC mit Z). Zwei sind
# gefallen: list_api_keys und create_api_key. create_hook bleibt, NEU BEGRUENDET: ohne den
# created_at-Grund zeigte der Lauf die 422 von _validate_create mit String-detail — derselbe
# Check, ein zweiter Grund, der darunter lag.
#
# HOOK-422 (2026-10-09, R-0207): create_hook ist gefallen. Die Hook-Routen antworten auf
# ungueltige Eingaben mit RequestValidationError, also im versprochenen Format
# HTTPValidationError (detail als Liste); update_hook ebenso.
#
# PROXY-STUB (2026-10-02, R-0063): Die fuenf raises-Eintraege der Proxy-Routen
# (proxy_to_monitoring GET/PUT/POST/DELETE, proxy_agent_report) sind gefallen. Ihr
# Grund war der prozessweite httpx-Client, den der Lifespan schliesst; die Fixture
# monitoring_stub in tests/test_schemathesis.py ersetzt ihn je Test durch einen
# httpx.MockTransport mit fester 200-Antwort. Ohne Stub und ohne die Eintraege:
# `4 failed, 304 passed` (proxy_agent_report in allen vier Kontexten).
#
# RANDVALIDIERUNG (2026-09-22/23, Vorhaben input-boundary-validation). Bilanz, gegen
# `git show main:` nachgezaehlt: 27 Eintraege vorher, 29 nachher — zwei entfernt, acht
# verengt, einer VERBREITERT, vier hinzugekommen.
#
# ENTFERNT (2), weil der Fehler behoben ist und die Operation keinen zweiten Grund hat:
# delete_api_key und delete_user. Beide nehmen nur einen (jetzt begrenzten) int-Pfad-
# parameter, keinen Body und keine Query — es gibt dort nichts, woran ein anderer Check
# haengen koennte.
#
# VERENGT (8) von der GANZEN Operation auf einen einzelnen Check — dort laeuft
# not_a_server_error wieder mit: list_audit, list_hooks, list_servers, get_connections,
# list_notifications, mark_read, update_user und mint_enrollment_token_for. Bei allen acht war die Ursache des Voll-Ausschlusses
# (Paginierungs- bzw. BIGINT-Ueberlauf, das NUL-Byte in den Audit-Filtern) behoben; was
# bleibt, ist negative_data_rejection — Framework-Verhalten, kein Defekt. Vier davon kamen
# erst nach dem Aufraeumen zum Vorschein: beim Abraeumen waren sie ganz weggefallen,
# obwohl nur ihr ERSTER Grund behoben war. Zwei hat der Abschlusslauf gezeigt, zwei der
# Review dazu; alle vier sind einzeln nachgestellt. Die Lehre: einen Eintrag entfernt man
# nach dem, was die Route TUT, nicht nach dem, was in seiner Begruendung steht.
#
# VERBREITERT (1): list_tunnels, von checks auf raises. Der einzige Eintrag, bei dem KEIN
# Grund behoben ist — der NUL-Pfad ueber die Query-Parameter kam zum bestehenden
# negative_data_rejection dazu. Er darf spaeter nicht geloescht, sondern nur auf checks
# zurueckgenommen werden; seine reason sagt das.
#
# HINZUGEKOMMEN (4): die Catch-all-Routen des Monitoring-Proxys. Kein Produktfehler auf diesen
# Routen, sondern eine Eigenschaft der Fixture: ein prozessweiter Client, ein Lifespan, und wer
# nach dem Shutdown drankommt, bekommt keine Response mehr.
#
# ZURUECKGEHOLT (8) — die Lehre dieses Vorhabens: beim ersten Aufraeumen wurden Eintraege
# anhand ihrer DOKUMENTIERTEN Begruendung entfernt statt anhand der Route. Die alte Begruendung
# war jeweils behoben (Tag-Validator, Fremdschluessel), die Route stirbt aber weiter an einem
# NUL-Byte in einem ANDEREN Feld. Gefunden hat das erst der Abschluss-Review, den achten Fall
# der Review der Nacharbeit. Jeder der acht ist unten einzeln nachgestellt und traegt die
# Begruendung, die heute zutrifft.
#
# Drei neue Produktfehler derselben Klasse hat der Fuzzer gezeigt, nachdem die behobenen
# Ausschluesse gefallen waren: NUL im `script` von POST /api/hooks, in `server_ids` von
# POST /api/users und in den Textfeldern von POST /api/internal/events. Alle drei sind behoben
# (SafeText), nicht ausgeschlossen. Die Klasse war damit belegt und NICHT flaechendeckend
# geschlossen — das hat das naechste Vorhaben entschieden (unten).
#
# NUL-FLAECHENREGEL (2026-09-23, Vorhaben nul-byte-rejection). Bilanz, per tomllib gegen
# `git show main:` ausgezaehlt: 29 Eintraege vorher, 23 nachher — sechs entfernt, zwei verengt,
# drei Begruendungen neu gemessen.
#
# Ein NUL-Byte wird jetzt flaechig am Rand abgelehnt: im Pfad und im Query-String von einer
# Middleware vor dem Routing (app/core/middleware.py), im Body von der gemeinsamen Basisklasse
# aller Request-Schemas (RequestModel, app/core/bounds.py). Ein Ausschluss wegen NUL ist damit
# nicht mehr noetig; ein neuer 500er aus einem NUL waere ein Fehler dieser Regel, kein Eintrag hier.
#
# ENTFERNT (6): create_server, update_server, update_tunnel, create_playbook, update_playbook und
# create_tunnel. Jeder NUL-Fall, den ihre Begruendung nannte, ist einzeln an der Route nachgestellt
# (422), danach lief der dienstuebergreifende Fuzz-Lauf auf ihnen ohne Befund.
#
# VERENGT (2) von raises auf checks = [negative_data_rejection]: list_tunnels, dessen zweiten Grund
# der Eintrag ausdruecklich festhielt (der Absatz VERBREITERT oben ist damit zurueckgenommen), und
# create_connection. Dort zeigte der erste Fuzz-Lauf ohne den Ausschluss zwei neue Treffer derselben
# Framework-Klasse (lax mode, Header-Blindstelle), keinen 500er. not_a_server_error laeuft auf
# beiden wieder mit.
#
# NEU GEMESSEN (3): list_audit, mint_enrollment_token_for und list_notifications nannten NUL bzw.
# SafeText in ihrer Begruendung. Ihr tragender Grund, negative_data_rejection, ist am 2026-09-23
# erneut nachgestellt; NUL steht dort nur noch als behobene Historie.

[[exclude]]
operation_id = "list_audit_api_audit_get"
checks = ["negative_data_rejection"]
# GET /api/audit
reason = "negative_data_rejection — `?q=null&actor_type=true` -> 200, gemessen im Lauf vom 2026-09-22 und erneut nachgestellt 2026-09-23: zwei Ursachen in einem Treffer, beide Framework-Verhalten. Pydantic v2 koerziert im lax mode `actor_type=true` auf einen String, und der Check laesst den Authorization-Header weg, waehrend die Fixture ihn von aussen ueber headers= setzt (prepare_headers merged sie ueber die mutierten). Ein NUL-Byte in einem der sechs Textfilter lehnt seit 2026-09-23 die NUL-Middleware vor dem Routing ab (422, nachgestellt mit `?q=%00`), `not_a_server_error` laeuft hier also mit"
until = "Entscheidung: den Check abschalten statt Operationen auszuschliessen"

[[exclude]]
operation_id = "list_notifications_api_notifications_get"
checks = ["negative_data_rejection"]
# GET /api/notifications
reason = "negative_data_rejection — derselbe zweite Grund wie bei list_hooks, list_servers und get_connections: FastAPI ignoriert unbekannte Query-Parameter, und der Check laesst zusaetzlich den Authorization-Header weg, waehrend die Fixture ihn von aussen ueber headers= setzt. Die Route antwortet mit 200, der Check liest das als akzeptierte schema-widrige Daten. Nachgestellt 2026-09-23 mit `GET /api/notifications?unknown_param=1` -> 200. Der NUL-Parametername aus dem Abschlusslauf vom 2026-09-23 antwortet inzwischen 422 (NUL-Middleware, nachgestellt), traegt den Eintrag also nicht mehr; der offset-Ueberlauf ist seit 2026-09-22 behoben"
until = "Entscheidung: den Check abschalten statt Operationen auszuschliessen"

[[exclude]]
operation_id = "mark_read_api_notifications_read_post"
checks = ["negative_data_rejection"]
# POST /api/notifications/read
reason = "negative_data_rejection — Pydantic v2 koerziert im lax mode, und FastAPI ignoriert unbekannte Body-Felder. Nachgestellt 2026-09-23: `{\"ids\": [\"5\"]}` -> 200, `{\"ids\": [true]}` -> 200, `{\"unknown\": 1}` -> 200. Framework-Verhalten, kein Defekt. Der alte Eintrag nannte diesen Grund schon neben dem BIGINT-Ueberlauf; der Ueberlauf ist behoben (ids ist list[BigIntPk]), dieser Grund nicht — beim Aufraeumen ist die ganze Operation mit weggefallen statt nur der behobene Teil"
until = "Entscheidung: den Check abschalten statt Operationen auszuschliessen"

[[exclude]]
operation_id = "update_user_api_users__user_id__put"
checks = ["negative_data_rejection"]
# PUT /api/users/{user_id}
reason = "negative_data_rejection — dieselbe Lax-Koerzierung wie beim Anlegen (create_user, unveraendert in dieser Datei): `is_admin` ist ein bool, Pydantic v2 nimmt im lax mode 1 und \"yes\" an, und unbekannte Body-Felder verschluckt FastAPI. Nachgestellt 2026-09-23 gegen einen EXISTIERENDEN Benutzer (mit einer unbekannten Id antwortet die Route 404, und 404 steht auf der Erwartungsliste des Checks, der Treffer bliebe also verborgen): `{\"is_admin\": 1}`, `{\"is_admin\": \"yes\"}` und `{\"unknown_field\": 1}` jeweils -> 200. Framework-Verhalten, kein Defekt. Der int-Ueberlauf auf `user_id`, wegen dem hier bis zum 2026-09-22 die GANZE Operation stand, ist behoben (IntPk) — deshalb nur noch dieser eine Check"
until = "Entscheidung: den Check abschalten statt Operationen auszuschliessen"

[[exclude]]
operation_id = "mint_enrollment_token_for_api_enrollment_token_for_post"
checks = ["negative_data_rejection"]
# POST /api/enrollment/token/for
reason = "negative_data_rejection — dasselbe Muster wie beim Self-Service-Pendant mint_self_enrollment_token, das den Eintrag unveraendert traegt: `browser` ist ein bool und wird im lax mode aus 1 koerziert, unbekannte Body-Felder verschluckt FastAPI. Nachgestellt 2026-09-23 gegen einen EXISTIERENDEN Benutzer: `{\"username\": \"target\", \"browser\": 1}` und `{\"username\": \"target\", \"unknown_field\": 1}` jeweils -> 200. Ein NUL-Byte im Benutzernamen lehnt die gemeinsame Request-Basisklasse ab (422 mit loc body.username, nachgestellt 2026-09-23) — deshalb nur dieser eine Check"
until = "Entscheidung: den Check abschalten statt Operationen auszuschliessen"

[[exclude]]
operation_id = "mint_self_enrollment_token_api_enrollment_token_post"
checks = ["negative_data_rejection"]
# POST /api/enrollment/token
reason = "negative_data_rejection — Pydantic v2 koerziert im lax mode (int->bool, str->zahl), die Route nimmt einen schema-widrigen Typ an und normalisiert ihn. Framework-Verhalten, kein Defekt; belegt an is_admin, dashboard_port, ids"
until = "Entscheidung T3: Check abschalten statt Operationen ausschliessen"

[[exclude]]
