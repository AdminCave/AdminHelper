# POST /api/auth/logout
reason = "zwei Checks, beide gemessen: ignored_auth — die Route antwortet ohne Token mit 200; negative_data_rejection — sie nimmt auch einen schema-widrigen Body an. Beides dieselbe Ursache: die Route verlangt gar nichts. Nachgeprueft: sie blacklistet dann nichts, loescht nur das Cookie und schreibt einen Audit-Eintrag. Schema deklariert Auth, Route verlangt keine — Mismatch, kein Loch"
until = "Roadmap: Schema und Route in Einklang bringen"

