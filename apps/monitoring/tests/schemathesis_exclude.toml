# Operationen, die der schema-getriebene Fuzzer NICHT anfasst (tests/test_schemathesis.py).
#
# Ein Eintrag ist eine Entscheidung mit Grund und Datum, nie ein stilles "-x" im Skript.
# Leer heisst: der Erstlauf hat nichts gefunden, das ausgeschlossen werden musste.
#
#   operation_id  die Id aus dem OpenAPI-Schema
#   checks        die Checks, die hier gewaehrt werden — die Operation bleibt im Lauf
#   raises        statt checks: der Aufruf stirbt an einer ungefangenen Exception,
#                 bevor eine Response entsteht; dann kann kein Check greifen und nur
#                 dann ist es ehrlich, die ganze Operation auszunehmen
#   reason        warum, mit Beleg aus einem Lauf
#   until         woran die Wiedervorlage haengt
#
# Ein Eintrag ohne checks UND ohne raises ist ein Fehler: er wuerde
# not_a_server_error mit stummschalten, also genau den Check, der die 500er findet.

#
# RANDVALIDIERUNG (2026-09-22, Vorhaben input-boundary-validation): die drei offset-Eintraege
# (/checks, /status, /alerts) sind weg, weil der Fehler behoben ist statt stummgeschaltet — die
# Parameter tragen jetzt eine obere Schranke aus app/core/bounds.py. Damit laeuft
# not_a_server_error auf allen drei Routen wieder mit. Uebrig bleibt der eine Eintrag, den ein
# laufender AdminHelper-Server braucht; im Lauf vom 2026-09-22 nach dem Fix erneut gesehen.
#
# NUL-FLAECHENREGEL (2026-09-23, Vorhaben nul-byte-rejection): kein Eintrag betroffen, Bilanz
# 1 -> 1. Ein NUL-Byte lehnt das Monitoring jetzt flaechig am Rand ab — im Pfad und im Query-String
# die Middleware, im Body RequestModel, im Agent-Report der Handler nach dem Liveness-Commit.
# Ein Ausschluss dafuer ist nicht mehr noetig; ein neuer 500er aus einem NUL waere ein Fehler
# dieser Regel, kein Eintrag hier.

[[exclude]]
operation_id = "trigger_tag_sync_templates_tag_sync_post"
checks = ["not_a_server_error"]
# POST /templates/tag-sync
reason = "not_a_server_error — Route ruft den AdminHelper-Server ueber HTTP (SERVER_HUB_URL) und antwortet ohne ihn mit 502 {\"detail\":\"Server inventory unavailable\"}. Belegt im Lauf ohne Ausschluesse 2026-09-22 (einziger Fehlschlag der Suite). In-process nicht fuzzbar, ein laufender Stack ist Nicht-Ziel der Spec. Die uebrigen vier Checks laufen weiter"
until = "Stufe 8c (Cross-Service-Vertraege) oder ein Stub in dieser Fixture"
