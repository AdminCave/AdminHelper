[package]
name = "adminhelper"
version = "0.46.0"
description = "AdminHelper Desktop-Client — Remote-Verwaltung mit FRP-Tunneln"
authors = ["Kevin Stenzel <kevin@ks98.de>"]
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
# `stream` enables Response::bytes_stream() for the long-lived SSE client.
# `rustls-no-provider`: no aws-lc-rs. Every client therefore gets a preconfigured rustls config on
# ring (http_client::with_timeouts); reqwest panics building a client without one.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
# The public-CA trust anchors: the Mozilla roots reqwest 0.12's `rustls-tls` shipped.
webpki-roots = "1"
# StreamExt::next() over the SSE byte stream; `sink`: SinkExt::send() on the frame WebSocket
# (rdp_embedded/frame_ws.rs).
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Reconnect backoff (sleep) for the SSE client, the async session lock
# (session.rs) and the wait for the admin port of a stopped frpc (frpc.rs);
# tauri provides the runtime. `net` is in the build through reqwest already.
# `rt` and `macros`: embedded RDP runs its session on a runtime of its own and selects between
# the picture and the input of its WebSocket (rdp_embedded/). `process`, `io-util` and `fs`: the SFTP
# channel talks to the stdin/stdout of an ssh child (sftp.rs).
tokio = { version = "1", default-features = false, features = ["sync", "time", "net", "rt", "macros", "process", "io-util", "fs"] }
# SFTP client over any byte stream; it does not pull in russh (R-1072).
russh-sftp = "3.0.1"
url = "2"
open = "5"
# The OS keyring through keyring-core and one store crate per platform (keyring_store.rs), not the
# `keyring` 4 facade: its default store connects once per process and keeps a failed or stale
# Secret Service connection until restart; keyring 3 connected per call. Windows uses wincred directly.
keyring-core = "1"
tauri-plugin-shell = "2"
# Native "save as" dialog so the user picks where the browser .p12 is written.
tauri-plugin-dialog = "2"
# Native OS notifications: the bell feed also surfaces as desktop notifications.
tauri-plugin-notification = "2"
# Desktop logging: stdout + a size-rotated file in the app log dir; the file is
# the source for the diagnostics report.
tauri-plugin-log = "2"
log = "0.4"
chrono = "0.4"
# Token redaction in the diagnostics report.
regex = "1"
# TLS TOFU pinning (desktop self-signed path): a custom rustls ServerCertVerifier
# needs rustls + an explicit ring provider (must match the version reqwest's
# rustls resolves — 0.23 — or tls_backend_preconfigured's downcast fails at
# runtime). default-features=false keeps aws-lc-rs out; feature unification only
# adds to what reqwest already enabled.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.11"
# On-device ECDSA keypair + CSR for mTLS enrollment (A5). ring backend to match
# rustls above and keep aws-lc-rs out (feature unification only adds to ring).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Parse the enrolled cert/key/CA PEM into the rustls types for the mTLS client.
# rustls-pemfile is archived (Aug 2025); its PEM parsing moved into rustls-pki-types' PemObject API,
# already in the graph via rustls. Parses the enrolled mTLS material (7.5).
rustls-pki-types = { version = "1", features = ["alloc"] }
# Read the enrolled leaf's validity to decide when to auto-renew (A5b).
x509-parser = "0.18"
# Package the browser's enrolled cert + key as a PKCS12 for import (A5c).
p12 = "0.6"
# Parse the server-supplied visitor TOML to allow-list its structure before frpc
# executes it (3.59) — a compromised server must not inject arbitrary frpc config.
toml = "1"
# Overwrites the desktop's own copy of a password once it is handed on (RDP stdin,
# Windows Credential Manager) without unsafe code. Already in the lockfile via rustls.
zeroize = "1.8.2"
# The embedded SSH terminal (pty.rs): ssh runs in a pseudo console, ConPTY on Windows, without
# unsafe code in this crate.
portable-pty = "0.9"
# Embedded RDP (rdp_embedded/): IronRDP pinned to a reviewed Git revision, not a crates.io release,
# so the client API and the GFX fixes it relies on cannot move underneath us.
# The features are an allow-list: `rustls` and `udp` would pull in aws-lc-rs, and `sound` stays off
# (docs/features/arch-rdp-backend.md, E2). H.264 comes from the platform (Media Foundation on
# Windows, none on Linux), not openh264. The license_gate tests keep it that way.
ironrdp-client = { git = "https://github.com/Devolutions/IronRDP", rev = "f96f664abf0bdfe547f222bcd37e09899f00f310", default-features = false, features = ["clipboard", "rdpdr"] }
ironrdp-tls = { git = "https://github.com/Devolutions/IronRDP", rev = "f96f664abf0bdfe547f222bcd37e09899f00f310", default-features = false, features = ["rustls-ring"] }
# ironrdp-client calls tokio_tungstenite::client_async_tls without a feature gate (its RDCleanPath
# WebSocket transport, unused here), which only exists with a TLS feature of tokio-tungstenite. This one
# takes rustls without default features, so the provider stays ring.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-native-roots"] }
# The input events, the logon error notices, the platform type and the update region of the
# session (rdp_embedded/session.rs, frame_ws.rs).
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "f96f664abf0bdfe547f222bcd37e09899f00f310" }
# The kind of a connect error and the reason of a graceful disconnect, which ironrdp-client does
# not re-export; both are in the lockfile through it already.
ironrdp-connector = { git = "https://github.com/Devolutions/IronRDP", rev = "f96f664abf0bdfe547f222bcd37e09899f00f310" }
ironrdp-session = { git = "https://github.com/Devolutions/IronRDP", rev = "f96f664abf0bdfe547f222bcd37e09899f00f310" }
# The client name the RDP server shows for the session.
gethostname = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
# Threading + SystemInformation: without Windows Terminal, the cmd console starts through
# CreateProcessW from the system directory (terminal.rs, spawn_in_new_console).
# JobObjects (Security for CreateJobObjectW, Threading for OpenProcess and the limit struct): frpc
# ends with the desktop process (frpc.rs, end_with_this_process).
windows = { version = "0.62", features = ["Win32_Security", "Win32_Security_Credentials", "Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_JobObjects"] }

# A second launch focuses the running window instead of starting a second app.
# Desktop targets only, as the plugin's docs install it.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
# Real-handshake TOFU test: an in-process TLS server presenting a controlled
# certificate, so we can prove reqwest actually invokes the pinning verifier and
# rejects a cert change end to end. Both are already in the lockfile (cached).
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time"] }
# default-features=false keeps aws-lc-rs (and its cmake/C build) out of the test
# tree, so tests use the same ring provider as the shipped binary.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
