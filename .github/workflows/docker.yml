name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  # "released": a release was published, or a pre-release was changed to a release
  # (GitHub docs, webhook events, release). A beta stays a pre-release, so this
  # fires when Kevin makes it stable, and only then does "latest" move (job latest).
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Keyless cosign signing via the GitHub OIDC token (no private key to manage).
  id-token: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.image }} image
    # The release event only moves "latest"; the image of its tag is already built.
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: .
            dockerfile: Dockerfile
          - image: monitoring
            context: apps/monitoring
            dockerfile: apps/monitoring/Dockerfile
          - image: ca-issuer
            context: apps/ca-issuer
            dockerfile: apps/ca-issuer/Dockerfile
          - image: gateway
            context: apps/gateway
            dockerfile: apps/gateway/Dockerfile
          - image: frps
            context: apps/frps
            dockerfile: apps/frps/Dockerfile
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          # metadata-action lower-cases the image ref (ghcr requires lower-case
          # paths); the org owner "AdminCave" is itself mixed-case.
          images: ghcr.io/${{ github.repository_owner }}/adminhelper/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
          # No "latest" on a tag push: a tag vX.Y.Z is a beta until its release turns
          # stable, and job latest moves "latest" then (R-0014).
          flavor: |
            latest=false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # In-toto SLSA provenance + SBOM attestations attached to the image.
          provenance: mode=max
          sbom: true

      # Keyless signature over the pushed digest (covers every tag pointing at
      # it). Verifiable with:
      #   cosign verify ghcr.io/admincave/adminhelper/<image> \
      #     --certificate-identity-regexp 'https://github.com/AdminCave/AdminHelper/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        # ghcr requires lower-case paths and the org owner ("AdminCave") is
        # mixed-case, so lower-case it to match the pushed (lower-cased) ref.
        run: |
          IMAGE="ghcr.io/${OWNER,,}/adminhelper/${{ matrix.image }}"
          cosign sign --yes "${IMAGE}@${DIGEST}"

  # A release turned stable: point "latest" of every image at X.Y.Z, the image the
  # tag push built and signed. Retagged by digest, never rebuilt. GitHub runs the
  # docker.yml of the tagged commit, so this works for tags cut after the job came.
  latest:
    name: Tag the stable release as latest
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Point latest at the release and sign it (keyless)
        env:
          OWNER: ${{ github.repository_owner }}
        # Every digest is resolved before any "latest" moves: a missing image fails
        # the job while all of them still name the previous stable release.
        # imagetools create with one source that is an image index makes a carbon
        # copy, so "latest" keeps the digest the tag push signed; the check holds it
        # to that, and this run adds its own signature over that digest.
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          BASE="ghcr.io/${OWNER,,}/adminhelper"
          IMAGES="server monitoring ca-issuer gateway frps"
          declare -A DIGEST
          for img in $IMAGES; do
            DIGEST[$img]="$(docker buildx imagetools inspect "${BASE}/${img}:${VER}" --format "{{json .Manifest}}" | jq -r .digest)" || true
            [[ "${DIGEST[$img]}" == sha256:* ]] || { echo "::error::${img}:${VER} not found on ghcr, no latest moved"; exit 1; }
          done
          for img in $IMAGES; do
            docker buildx imagetools create --tag "${BASE}/${img}:latest" "${BASE}/${img}@${DIGEST[$img]}"
            now="$(docker buildx imagetools inspect "${BASE}/${img}:latest" --format "{{json .Manifest}}" | jq -r .digest)" || true
            [ "$now" = "${DIGEST[$img]}" ] \
              || { echo "::error::${img}:latest is ${now}, not ${img}:${VER} (${DIGEST[$img]})"; exit 1; }
            cosign sign --yes "${BASE}/${img}@${DIGEST[$img]}"
            echo "ok: ${img}:latest -> ${VER} (${DIGEST[$img]})"
          done
