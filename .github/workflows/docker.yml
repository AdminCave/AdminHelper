name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  # "released": a release was published, or a pre-release was changed to a release
  # (GitHub docs, webhook events, release). A beta stays a pre-release, so this
  # fires when Kevin makes it stable, and only then does "latest" move (job latest).
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Keyless cosign signing via the GitHub OIDC token (no private key to manage).
  id-token: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.image }} image
    # The release event only moves "latest"; the image of its tag is already built.
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: .
            dockerfile: Dockerfile
          - image: monitoring
            context: apps/monitoring
            dockerfile: apps/monitoring/Dockerfile
          - image: ca-issuer
            context: apps/ca-issuer
            dockerfile: apps/ca-issuer/Dockerfile
          - image: gateway
            context: apps/gateway
            dockerfile: apps/gateway/Dockerfile
          - image: frps
            # The repository root: the image builds its plugin from the Go module of the agent.
            context: .
            dockerfile: apps/frps/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lower-cases the image ref (ghcr requires lower-case
          # paths); the org owner "AdminCave" is itself mixed-case.
          images: ghcr.io/${{ github.repository_owner }}/adminhelper/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
          # No "latest" on a tag push: a tag vX.Y.Z is a beta until its release turns
          # stable, and job latest moves "latest" then (R-0014).
          flavor: |
            latest=false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # A tag build restores and stores no build cache (R-1349, like release.yml): the
          # image it signs is built from the tagged tree alone. main keeps the cache.
          # cache_settings.sh --tag-uncached holds this form.
          no-cache: ${{ startsWith(github.ref, 'refs/tags/') }}
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha,scope={0}', matrix.image) || '' }}
          cache-to: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}
          # In-toto SLSA provenance + SBOM attestations attached to the image.
          provenance: mode=max
          sbom: true

      # Keyless signature over the pushed digest (covers every tag pointing at
      # it). cosign 3 stores it as a Sigstore bundle in an OCI 1.1 referrer, so
      # checking it takes cosign 3 (or 2.6+ with --new-bundle-format):
      #   cosign verify ghcr.io/admincave/adminhelper/<image> \
      #     --certificate-identity-regexp 'https://github.com/AdminCave/AdminHelper/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # The fresh signature is verified right away against the identity of this
      # run: a signature that did not land fails this run, not the job latest
      # at the next stable release.
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        # ghcr requires lower-case paths and the org owner ("AdminCave") is
        # mixed-case, so lower-case it to match the pushed (lower-cased) ref.
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER,,}/adminhelper/${{ matrix.image }}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" > /dev/null

  # A release turned stable: point "latest" of every image at X.Y.Z, the image the
  # tag push built and signed. Retagged by digest, never rebuilt, and not signed
  # again: the signature of the tag push hangs on the digest. GitHub runs the
  # docker.yml of the tagged commit, so this works for tags cut after the job came.
  latest:
    name: Tag the stable release as latest
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Point latest at the signed images of the release
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        # Only the release that is "Latest" now moves "latest": an older release made
        # stable later leaves it alone. Every digest is resolved and the signature job
        # build made on the push of this tag verified before any "latest" moves: a
        # missing or unsigned image fails the job while all of them still name the
        # previous stable release. imagetools create with one source that is an image
        # index makes a carbon copy, so "latest" keeps the digest the tag push signed;
        # the check holds it to that. A failure after the first create can leave some
        # images moved, hence "rerun the job". The digits are spelled out: under
        # de_DE.UTF-8, bash lets [0-9] match "²" too.
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          [[ "$VER" =~ ^[0123456789]+\.[0123456789]+\.[0123456789]+$ ]] \
            || { echo "::error::tag ${GITHUB_REF_NAME} is not vX.Y.Z, no latest moved"; exit 1; }
          LATEST="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [ "$LATEST" != "$GITHUB_REF_NAME" ]; then
            echo "::notice::the latest release is ${LATEST}, not ${GITHUB_REF_NAME}: latest stays where it is"
            exit 0
          fi
          BASE="ghcr.io/${OWNER,,}/adminhelper"
          SIGNER="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker.yml@refs/tags/${GITHUB_REF_NAME}"
          IMAGES="server monitoring ca-issuer gateway frps"
          declare -A DIGEST
          for img in $IMAGES; do
            DIGEST[$img]="$(docker buildx imagetools inspect "${BASE}/${img}:${VER}" --format "{{json .Manifest}}" | jq -r .digest)" || true
            [[ "${DIGEST[$img]}" == sha256:* ]] || { echo "::error::${img}:${VER} not found on ghcr, no latest moved"; exit 1; }
            cosign verify --certificate-identity "$SIGNER" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${BASE}/${img}@${DIGEST[$img]}" > /dev/null \
              || { echo "::error::${img}:${VER} (${DIGEST[$img]}) has no valid signature of ${SIGNER}, no latest moved"; exit 1; }
          done
          for img in $IMAGES; do
            docker buildx imagetools create --tag "${BASE}/${img}:latest" "${BASE}/${img}@${DIGEST[$img]}" \
              || { echo "::error::${img}:latest not moved, latest of the images before it may have: rerun the job"; exit 1; }
          done
          for img in $IMAGES; do
            now="$(docker buildx imagetools inspect "${BASE}/${img}:latest" --format "{{json .Manifest}}" | jq -r .digest)" || true
            [ "$now" = "${DIGEST[$img]}" ] \
              || { echo "::error::${img}:latest is ${now}, not ${img}:${VER} (${DIGEST[$img]}): rerun the job"; exit 1; }
            echo "ok: ${img}:latest -> ${VER} (${DIGEST[$img]})"
          done
