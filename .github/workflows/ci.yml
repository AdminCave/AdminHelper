name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push to main gets a group of its own and is never cancelled or pushed out
# while pending: its run is the only one that reads before..sha (R-0174). Pull
# requests still cancel the older run of the same ref.
concurrency:
  group: ${{ github.event_name == 'push' && format('ci-push-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FRP_VERSION: "0.69.1"
  # Pinned SHA-256 of the official frp release artifacts (verified before use).
  FRP_SHA256_LINUX_AMD64: "7be257b72dbbc60bcb3e0e25a5afd1dfac7b63f897084864d3c956dd3d5674e1"
  FRP_SHA256_WINDOWS_AMD64: "829ac915f8655d4d4e021b8db61b46c3445205ed80d32b04cda7fa89d87c46e0"

jobs:
  server:
    name: Server (pytest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The 3.13 leg pulls the base images and runs the image tests on top of the suite.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adminhelper
          POSTGRES_PASSWORD: cipw
          POSTGRES_DB: adminhelper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adminhelper -d adminhelper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # The SSE Redis fan-out test (test_stream_redis) skips itself when no Redis is
      # reachable; without this service it never ran in PR CI, so a break in
      # stream_hub.publish/start would pass green. 6380 matches the test's URL (6.84).
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # conftest.py uses DATABASE_URL directly when set (CI mode) instead of
      # spinning up a testcontainers Postgres. postgresql:// is normalised to
      # the psycopg3 driver inside conftest.
      DATABASE_URL: postgresql+psycopg://adminhelper:cipw@localhost:5432/adminhelper
      DATA_DIR: /tmp/adminhelper-test-data
      SECRET_KEY: ci-test-secret-key
      ADMIN_PASSWORD: ciadmin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/server/requirements*
      - name: Install dependencies
        working-directory: apps/server
        # requirements-dev.txt pulls in requirements.in (loose, unhashed); the
        # hashed requirements.txt lock the image ships is python-lock-server's.
        run: pip install -r requirements-dev.txt
      # The tests that build or start an image skip without its base image at hand: those
      # of frps, of the gateway and of the Python images, whose last stage builds on the
      # base of apps/ca-issuer. They do not depend on the Python version, so one leg runs them.
      - name: Pull the base images of the image tests
        if: matrix.python-version == '3.13'
        run: |
          for dockerfile in apps/frps/Dockerfile apps/gateway/Dockerfile apps/ca-issuer/Dockerfile; do
            docker pull "$(sed -n 's/^FROM //p' "$dockerfile")"
          done
      - name: Run pytest
        working-directory: apps/server
        # Coverage is report-only (no threshold) — visibility, not a gate.
        # -m "not schemathesis": the fuzz suite has its own budget and its own
        # run.sh step; collected here it would run a second time inside this job.
        # -rs names each skip in the log; the next step reads the skips from the JUnit XML.
        run: pytest -q -rs -m "not schemathesis" --cov=app --cov-report=term --junitxml="$RUNNER_TEMP/pytest-server.xml"
      # A test whose precondition is missing skips, and pytest stays green. This leg has them
      # all (Postgres, Redis, the base images), so a skip here is a test that no longer runs.
      - name: No test skipped
        if: matrix.python-version == '3.13'
        run: |
          python3 - "$RUNNER_TEMP/pytest-server.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          try:
              cases = list(ET.parse(sys.argv[1]).iter("testcase"))
          except (OSError, ET.ParseError) as err:
              print(f"::error::no readable JUnit XML from Run pytest: {err}")
              sys.exit(1)
          skips = [(case, skip) for case in cases for skip in case.findall("skipped")]
          for case, skip in skips:
              print(f"{case.get('classname')}::{case.get('name')}: {skip.get('message')}")
          if skips:
              print(f"::error::{len(skips)} of {len(cases)} tests skipped in the leg that has what they need")
              sys.exit(1)
          print(f"{len(cases)} tests, none skipped")
          PY

  python-lint:
    name: Python (ruff check + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install ruff
        # Pin ruff: a new release changes format rules / adds lints and would red every
        # open PR with no code change, and is unreproducible against a local ruff. Keep
        # in sync with the ruff pin in apps/server/requirements-dev.txt (4.88).
        run: pip install ruff==0.15.20
      - name: ruff check
        run: ruff check apps/server apps/monitoring apps/ca-issuer scripts
      - name: ruff format --check
        run: ruff format --check apps/server apps/monitoring apps/ca-issuer scripts

  monitoring:
    name: Monitoring (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # For the tests that need a real Postgres: test_migrations_smoke and
      # test_alembic_builtin (the migration chain), test_check_engine_concurrency
      # (the FOR UPDATE row lock) and test_db_session_utc (the session time zone).
      # The rest of the monitoring suite runs on SQLite.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adminhelper
          POSTGRES_PASSWORD: cipw
          POSTGRES_DB: adminhelper_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adminhelper -d adminhelper_monitor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://adminhelper:cipw@localhost:5432/adminhelper_monitor
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/monitoring/requirements*
      - name: Install dependencies
        working-directory: apps/monitoring
        # requirements-dev.txt pulls in requirements.in (loose, unhashed); the
        # hashed requirements.txt lock the image ships is python-lock-monitoring's.
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        working-directory: apps/monitoring
        # Coverage is report-only (no threshold) — visibility, not a gate.
        run: python -m pytest -q -m "not schemathesis" --cov=app --cov-report=term

  ca-issuer:
    name: CA-Issuer (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adminhelper
          POSTGRES_PASSWORD: cipw
          POSTGRES_DB: adminhelper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adminhelper -d adminhelper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AH_TEST_DB: postgresql+psycopg://adminhelper:cipw@localhost:5432/adminhelper
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/ca-issuer/requirements*
      - name: Install dependencies
        working-directory: apps/ca-issuer
        # requirements-dev.txt pulls in requirements.in (loose, unhashed); the hashed
        # requirements.txt lock the image ships is python-lock-ca-issuer's. The test-only
        # httpx dep and the reason it is test-only are documented in that file.
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        working-directory: apps/ca-issuer
        # The suite runs on the in-memory token store (no DATABASE_URL, 6.3/6.4). The pg_engine
        # tests of test_db_token_store.py (TOCTOU, concurrency) need the Postgres service
        # through AH_TEST_DB and skip without it.
        run: python -m pytest -q -m "not schemathesis"

  # The images install the hashed lock on python:3.12-slim; the three jobs above
  # test the loose requirements.in, which runs ahead of it (fastapi 0.138 broke
  # test_route_auth_gate only in the loose state). These three run the same suites
  # against what the image ships: the lock with --require-hashes as the Dockerfile
  # does, the dev deps on top in a second call (one hashed line makes pip demand
  # hashes for every package, and -c cannot carry extras), then lock-pins.py proves
  # that installing them moved no pin. Three jobs, not a matrix: services and env
  # differ per service, and an empty env value is not an unset one. The names carry
  # no Python version so a base-image bump keeps the required-check names;
  # test_lock_pins.py holds python-version in lockstep with each Dockerfile's FROM.
  python-lock-server:
    name: Server (pytest, image lock)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adminhelper
          POSTGRES_PASSWORD: cipw
          POSTGRES_DB: adminhelper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adminhelper -d adminhelper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://adminhelper:cipw@localhost:5432/adminhelper
      DATA_DIR: /tmp/adminhelper-test-data
      SECRET_KEY: ci-test-secret-key
      ADMIN_PASSWORD: ciadmin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/requirements*
      - name: Install the image lock, then the dev dependencies
        working-directory: apps/server
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Every lock pin is installed as locked
        working-directory: apps/server
        run: python ../../scripts/dev/lock-pins.py requirements.txt
      - name: Run pytest
        working-directory: apps/server
        run: pytest -q -m "not schemathesis"

  python-lock-monitoring:
    name: Monitoring (pytest, image lock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adminhelper
          POSTGRES_PASSWORD: cipw
          POSTGRES_DB: adminhelper_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adminhelper -d adminhelper_monitor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://adminhelper:cipw@localhost:5432/adminhelper_monitor
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/monitoring/requirements*
      - name: Install the image lock, then the dev dependencies
        working-directory: apps/monitoring
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Every lock pin is installed as locked
        working-directory: apps/monitoring
        run: python ../../scripts/dev/lock-pins.py requirements.txt
      - name: Run pytest
        working-directory: apps/monitoring
        run: python -m pytest -q -m "not schemathesis"

  python-lock-ca-issuer:
    name: CA-Issuer (pytest, image lock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # As in ca-issuer: Postgres only for the pg_engine tests, through AH_TEST_DB.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adminhelper
          POSTGRES_PASSWORD: cipw
          POSTGRES_DB: adminhelper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adminhelper -d adminhelper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AH_TEST_DB: postgresql+psycopg://adminhelper:cipw@localhost:5432/adminhelper
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ca-issuer/requirements*
      - name: Install the image lock, then the dev dependencies
        working-directory: apps/ca-issuer
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Every lock pin is installed as locked
        working-directory: apps/ca-issuer
        run: python ../../scripts/dev/lock-pins.py requirements.txt
      - name: Run pytest
        working-directory: apps/ca-issuer
        run: python -m pytest -q -m "not schemathesis"

  schemathesis:
    name: Schema fuzzing (server + monitoring + ca-issuer)
    runs-on: ubuntu-latest
    # Its own job, not a step inside the three pytest ones: own budget, own
    # verdict, and a failure here says "a route answers something its schema does
    # not describe" rather than drowning in an unrelated suite.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adminhelper
          POSTGRES_PASSWORD: cipw
          POSTGRES_DB: adminhelper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adminhelper -d adminhelper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://adminhelper:cipw@localhost:5432/adminhelper
      DATA_DIR: /tmp/adminhelper-test-data
      SECRET_KEY: ci-test-secret-key
      ADMIN_PASSWORD: ciadmin
      MTLS_ENFORCE: "false"
      # The same value a developer runs locally, so "green here" and "green on my
      # machine" mean the same thing: 0 = only the explicit phase, the same cases for
      # the same tree. Depth is the weekly run's job, which sets 100 (every phase).
      AH_SCHEMATHESIS_EXAMPLES: "0"
      # run.sh installs into this venv; it is filled below so the step's
      # `import schemathesis` gate finds the package.
      AH_VENV: /tmp/ci-venv
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/*/requirements*
      - name: Install dev dependencies of all three services
        run: |
          python -m venv "$AH_VENV"
          "$AH_VENV/bin/pip" install -q \
            -r apps/server/requirements-dev.txt \
            -r apps/monitoring/requirements-dev.txt \
            -r apps/ca-issuer/requirements-dev.txt
      # One aggregator call, the same one a developer runs — CI and the dev box
      # cannot drift apart. --strict makes a skipped step a failure here, which is
      # the point: a missing schemathesis package must not pass as green.
      - name: Fuzz each service against its own schema
        run: bash scripts/tests/run.sh unit --strict --step schemathesis --only server monitoring ca-issuer

  agent:
    name: Go Agent (gofmt + vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27"
          # The runner image's toolcache can lag behind the newest patch, and the
          # stdlib fixes the agent needs ship in patch releases. Without check-latest,
          # setup-go takes the cached one.
          check-latest: true
          cache-dependency-path: apps/agent/go.sum
      - name: gofmt
        working-directory: apps/agent
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        working-directory: apps/agent
        run: go vet ./...
      - name: go vet (windows)
        working-directory: apps/agent
        # The ubuntu runner's default `go vet` never sees the //go:build windows files (the sc-query
        # collector). Vet them explicitly so a Windows-only parser bug is caught in CI (6.20).
        run: GOOS=windows go vet ./...
      - name: go test
        working-directory: apps/agent
        # Coverage is report-only (no threshold) — visibility, not a gate.
        # -race because the agent is concurrent (monitor, frpc, config): a data
        # race is the bug class neither review nor a single-threaded test sees.
        # It needs cgo, which ubuntu-latest has. Measured on this job: ~38 s
        # before, 75 s with the detector (run 34484154968) — far inside
        # timeout-minutes: 15.
        run: go test -race -cover ./...
      - name: Cross-compile (linux + windows)
        working-directory: apps/agent
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/adminhelper-agent
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/adminhelper-agent

  agent-windows:
    name: Go Agent (test, Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: apps/agent/go.sum
      # `GOOS=windows go vet` on the ubuntu runner only compiles; it executes nothing.
      # This job runs the agent's cross-platform tests on Windows and the windows-only
      # tests (*_windows_test.go), which no other job executes.
      # Hard on purpose (no continue-on-error): a red run here is a finding, not noise.
      - name: go test
        working-directory: apps/agent
        run: go test -v ./...
      - name: Build the Windows binary
        working-directory: apps/agent
        run: go build -o adminhelper-agent.exe ./cmd/adminhelper-agent
      - name: Smoke the built binary
        working-directory: apps/agent
        run: .\adminhelper-agent.exe version

  desktop-ui:
    name: Desktop-UI (svelte-check + lint + vitest) + E2E lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # The four types both api/types.ts files describe (FrpConfig, FrpStatus,
      # FrpStatusProxy, Server) are maintained twice. Every line the web file
      # declares has to exist in the desktop one — the desktop may carry more,
      # since it projects the same payload further (harness 8a, T14).
      - name: Shared API types in lockstep with the web frontend
        run: bash apps/desktop/ui/scripts/sync-from-web.sh --check
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/ui/package-lock.json
            apps/desktop/e2e/package-lock.json
      - name: npm ci
        working-directory: apps/desktop/ui
        run: npm ci --no-audit --no-fund
      - name: svelte-check
        working-directory: apps/desktop/ui
        run: npm run check
      - name: eslint + prettier
        working-directory: apps/desktop/ui
        run: npm run lint
      - name: vitest
        working-directory: apps/desktop/ui
        # Coverage is report-only (no threshold) — visibility, not a gate.
        run: npm run test -- --coverage
      - name: E2E specs npm ci
        working-directory: apps/desktop/e2e
        run: npm ci --no-audit --no-fund
      - name: E2E eslint
        working-directory: apps/desktop/e2e
        run: npm run lint

  frontend:
    name: Web-Frontend (check + lint + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm ci
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: svelte-check
        working-directory: apps/web
        run: npm run check
      - name: eslint + prettier
        working-directory: apps/web
        run: npm run lint
      - name: vitest
        working-directory: apps/web
        # Coverage is report-only (no threshold) — visibility, not a gate.
        run: npm run test:unit -- --coverage

  frontend-e2e:
    name: Web-Frontend (Playwright E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm ci
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      # Chromium alone: every project in playwright.config.ts runs it. Without a browser
      # argument --with-deps apt-installs the packages of every browser (the gstreamer/ffmpeg
      # chain of webkit and firefox), and run 39767066088 hung there on a stalled mirror until
      # the job timed out. A browser cache would not help: the hang was in apt, which no cache
      # covers. The step's own limit makes a stalled mirror cost 10 minutes, not the job.
      - name: Install Playwright browsers
        working-directory: apps/web
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Playwright test
        working-directory: apps/web
        run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  rust:
    name: Desktop-Backend (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev libssl-dev patchelf file
      - name: frpc sidecar (externalBin must resolve for tauri-build)
        run: |
          curl -fsSL -o frpc.tar.gz \
            "https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz"
          echo "${FRP_SHA256_LINUX_AMD64}  frpc.tar.gz" | sha256sum -c -
          tar xzf frpc.tar.gz
          mkdir -p apps/desktop/src-tauri/binaries
          cp "frp_${FRP_VERSION}_linux_amd64/frpc" \
            apps/desktop/src-tauri/binaries/frpc-x86_64-unknown-linux-gnu
          chmod +x apps/desktop/src-tauri/binaries/frpc-x86_64-unknown-linux-gnu
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  # Audit C1: the windows = "0.61" code paths were never compiled in CI —
  # "green but broken" releases were possible. cargo test now compiles AND runs
  # the windows-gated unit tests (6.33 — check alone never executed them); the
  # full MSI build stays in release.yml.
  rust-windows:
    name: Desktop-Backend (cargo test, Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: frpc sidecar (externalBin must resolve for tauri-build)
        shell: bash
        run: |
          curl -fsSL -o frpc.zip \
            "https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_windows_amd64.zip"
          echo "${FRP_SHA256_WINDOWS_AMD64}  frpc.zip" | sha256sum -c -
          unzip -o frpc.zip
          mkdir -p apps/desktop/src-tauri/binaries
          cp "frp_${FRP_VERSION}_windows_amd64/frpc.exe" \
            apps/desktop/src-tauri/binaries/frpc-x86_64-pc-windows-msvc.exe
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  # Audit C2: cargo tauri build (beforeBuildCommand, UI embedding, deb
  # bundling) only ran on tags — exactly the failure class of
  # fix/tauri-beforebuild-path surfaced at release time. Debug profile +
  # deb-only keeps it affordable as a PR gate.
  tauri-build-smoke:
    name: Desktop (tauri build smoke, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Install Tauri CLI
        # Keep this pin in lockstep with release.yml.
        run: cargo install tauri-cli --locked --version "2.11.2"
      - name: frpc sidecar
        run: |
          curl -fsSL -o frpc.tar.gz \
            "https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz"
          echo "${FRP_SHA256_LINUX_AMD64}  frpc.tar.gz" | sha256sum -c -
          tar xzf frpc.tar.gz
          mkdir -p apps/desktop/src-tauri/binaries
          cp "frp_${FRP_VERSION}_linux_amd64/frpc" \
            apps/desktop/src-tauri/binaries/frpc-x86_64-unknown-linux-gnu
          chmod +x apps/desktop/src-tauri/binaries/frpc-x86_64-unknown-linux-gnu
      - name: npm ci
        working-directory: apps/desktop/ui
        run: npm ci --no-audit --no-fund
      - name: cargo tauri build (debug, deb only)
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --debug --bundles deb

  # Audit C3: docker images were only built on pushes to main — a Dockerfile
  # break (e.g. hash mismatch under --require-hashes) landed on main first.
  docker-build:
    name: ${{ matrix.image }} image (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: .
            dockerfile: Dockerfile
          - image: monitoring
            context: apps/monitoring
            dockerfile: apps/monitoring/Dockerfile
          - image: ca-issuer
            context: apps/ca-issuer
            dockerfile: apps/ca-issuer/Dockerfile
          - image: gateway
            context: apps/gateway
            dockerfile: apps/gateway/Dockerfile
          - image: frps
            context: apps/frps
            dockerfile: apps/frps/Dockerfile
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Audit C7: FRP_VERSION (+ artifact SHAs) is pinned in four places that must move
  # in lockstep — drift breaks the tunnel at runtime, not in CI. The heavy-tier VM
  # bootstrap (scripts/vm/bootstrap_linux.sh) stages the same frpc sidecar
  # and is the 4th pin.
  frp-consistency:
    name: Pinned versions + signing key in lockstep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Compare the four FRP_VERSION pins
        run: |
          ci=$(grep -m1 '^  FRP_VERSION:' .github/workflows/ci.yml | grep -o '[0-9][0-9.]*')
          rel=$(grep -m1 '^  FRP_VERSION:' .github/workflows/release.yml | grep -o '[0-9][0-9.]*')
          # The frps image builds on the upstream frps image of the same release. Extract
          # only the version tag; the base carries a trailing @sha256:<digest> pin whose
          # hex would otherwise leak into the match.
          frps=$(grep -m1 '^FROM snowdreamtech/frps:' apps/frps/Dockerfile | sed -E 's#^FROM snowdreamtech/frps:([0-9][0-9.]*).*#\1#')
          boot=$(grep -m1 'FRP_VERSION=' scripts/vm/bootstrap_linux.sh | grep -o '[0-9][0-9.]*' | head -1)
          sha_ci=$(grep -m1 'FRP_SHA256_LINUX_AMD64:' .github/workflows/ci.yml | grep -o '[0-9a-f]\{64\}')
          sha_rel=$(grep -m1 'FRP_SHA256_LINUX_AMD64:' .github/workflows/release.yml | grep -o '[0-9a-f]\{64\}')
          sha_boot=$(grep -m1 'FRP_SHA256_LINUX_AMD64=' scripts/vm/bootstrap_linux.sh | grep -o '[0-9a-f]\{64\}')
          echo "ci.yml=$ci release.yml=$rel apps/frps/Dockerfile=$frps bootstrap_linux=$boot"
          test -n "$ci" && test "$ci" = "$rel" && test "$ci" = "$frps" && test "$ci" = "$boot" || {
            echo "::error::FRP_VERSION drift (ci=$ci, release=$rel, frps image=$frps, bootstrap=$boot)"; exit 1; }
          test "$sha_ci" = "$sha_rel" && test "$sha_ci" = "$sha_boot" || {
            echo "::error::FRP_SHA256_LINUX_AMD64 differs across ci.yml/release.yml/bootstrap_linux.sh"; exit 1; }
          # Windows SHA (ci vs release): a FRP_VERSION bump that updates only the ci copy
          # makes release.yml's desktop-windows `sha256sum -c` fail, and since that build
          # is continue-on-error the MSI silently drops from the release (4.22).
          sha_win_ci=$(grep -m1 'FRP_SHA256_WINDOWS_AMD64:' .github/workflows/ci.yml | grep -o '[0-9a-f]\{64\}')
          sha_win_rel=$(grep -m1 'FRP_SHA256_WINDOWS_AMD64:' .github/workflows/release.yml | grep -o '[0-9a-f]\{64\}')
          test -n "$sha_win_ci" && test "$sha_win_ci" = "$sha_win_rel" || {
            echo "::error::FRP_SHA256_WINDOWS_AMD64 differs between ci.yml and release.yml"; exit 1; }
          # tauri-cli pin (ci vs release): the 'Keep in lockstep' comment isn't enforced anywhere (4.22).
          tauri_ci=$(grep -m1 'cargo install tauri-cli' .github/workflows/ci.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          tauri_rel=$(grep -m1 'cargo install tauri-cli' .github/workflows/release.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          test -n "$tauri_ci" && test "$tauri_ci" = "$tauri_rel" || {
            echo "::error::tauri-cli pin differs (ci=$tauri_ci, release=$tauri_rel)"; exit 1; }
      - name: Toolchain pins in lockstep (go-version ↔ govulncheck, ruff, oasdiff)
        # audit.yml builds govulncheck from source under GOTOOLCHAIN=local, so the
        # pin only compiles while x/vuln's own `go` directive stays at or below the
        # go-version the workflows set — the coupling that made `@latest` stop
        # building when x/vuln v1.8.0 moved to `go 1.26.0`. The pin's comment says
        # "raise this together with go-version"; this step is that sentence enforced.
        # It reaches the module proxy: an outage exits 75 and reddens the job rather
        # than passing a check that never ran — `gh run rerun --failed`, not a fix.
        run: bash scripts/dev/toolchain-lockstep.sh
      - name: MINISIGN_PUBKEY in lockstep (install.sh vs update.sh)
        run: |
          ins=$(grep -m1 '^MINISIGN_PUBKEY=' scripts/install.sh | cut -d'"' -f2)
          upd=$(grep -m1 '^MINISIGN_PUBKEY=' scripts/update.sh | cut -d'"' -f2)
          echo "install.sh=$ins update.sh=$upd"
          test -n "$ins" && test "$ins" = "$upd" || {
            echo "::error::MINISIGN_PUBKEY drift (install=$ins, update=$upd) — a key rotation must touch both, else updates verify against the old key and break on every existing install"; exit 1; }

  openapi-compat:
    name: OpenAPI breaking changes (oasdiff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The gate diffs this branch's snapshot against the base branch's, so the
          # base ref has to exist locally. The default shallow clone has only this
          # commit — and openapi-breaking.sh refuses an unresolvable ref rather than
          # reporting "nothing to compare", so a missing one is red, not silently green.
          fetch-depth: 0
      # Anchored: ops-scripts runs this very step (*install-oasdiff), so version and
      # hash live here once. The alias has to stay below this job in the file. The
      # test boxes install the same pair (scripts/vm/bootstrap_linux.sh), and
      # scripts/dev/toolchain-lockstep.sh holds the two places together.
      - &install-oasdiff
        name: Install oasdiff
        # Release tarball, not `go install`: every oasdiff from v1.24.0 on declares
        # `go 1.26` in its go.mod, and these workflows run with GOTOOLCHAIN=local, so
        # a source build breaks the day oasdiff outruns our go-version — exactly the
        # way govulncheck did (PR #14). A prebuilt tarball needs no toolchain at all;
        # the SHA-256 below is the pin, so a swapped asset is a failure, not a
        # surprise binary.
        env:
          OASDIFF_VERSION: "1.32.0"
          # sha256 of oasdiff_1.32.0_linux_amd64.tar.gz from the release's checksums.txt.
          OASDIFF_SHA256_LINUX_AMD64: "5b2050787cfee2a9a3ba7b25cb50fe2c5cc45cdf5b96fbc51a4a60107f8b4aad"
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          url="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/oasdiff.tar.gz" "$url"
          echo "${OASDIFF_SHA256_LINUX_AMD64}  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/bin" oasdiff
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Server API stays compatible with the base branch
        run: bash scripts/dev/openapi-breaking.sh server --base "origin/${{ github.base_ref || 'main' }}"
      - name: Monitoring API stays compatible with the base branch
        run: bash scripts/dev/openapi-breaking.sh monitoring --base "origin/${{ github.base_ref || 'main' }}"

  # What must never become public (R-0123): the private roadmap, the security
  # ledgers, a security finding's Dedup-Key, the files that carry credentials, a
  # line or a commit message with a token pattern (R-0183). The
  # same `review.sh sec` the local hooks run, here over every commit a pull request
  # or a push brings — for what goes past the local hooks (a clone without
  # core.hooksPath, the web editor, another machine). It needs no secret, so it runs
  # for pull requests from forks too, and it names paths and file:line, never
  # content, so its log may be public. The event values reach the script as
  # environment, never as expressions inside it. It reads with the base's review.sh
  # and with this change's (R-0174): a change to review.sh is checked with the logic
  # that held before it. The price: a pull request that fixes a false alarm of the
  # base logic is still held by it (an admin merge then).
  public-repo-guard:
    name: Public repo guard (review.sh sec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Every commit of the span is read, and the base has to exist locally.
          fetch-depth: 0
      - name: review.sh sec over the commits this change brings
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # The span names $SHA, not HEAD: in the base worktree below HEAD is the base.
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF"; range="$base...$SHA" ;;
            push)
              # An empty or all-zero `before` says nothing about what this push brings:
              # fail closed. On main it does not happen, the ruleset forbids force pushes.
              if [ -z "${BEFORE//0/}" ]; then
                echo "::error::push without a usable 'before' — cannot tell which commits it brings"
                exit 1
              fi
              # origin/main is the pushed commit already; the base is main before it.
              base="$BEFORE"; range="$BEFORE..$SHA" ;;
            *) base="origin/main"; range="origin/main...$SHA" ;;
          esac
          # The logic of the base first (R-0174): a change that loosens or breaks sec is
          # still read by the rule it is about to change. Then this change's own logic,
          # which keeps the job in step with the local hooks. Both have to be green.
          git worktree add --quiet --detach "$RUNNER_TEMP/base" "$base"
          base_sh="$RUNNER_TEMP/base/scripts/dev/review.sh"
          if [ ! -f "$base_sh" ] || ! grep -q -- '--range' "$base_sh"; then
            echo "::error::the base ($base) has no review.sh that reads a range — refusing (fail closed)"
            exit 1
          fi
          # A span without commits (a dispatch on main) reads nothing: a notice, not "clean".
          guard() {  # guard <review.sh>
            local out
            out="$(bash "$1" sec --range "$range")" || return
            case "$out" in
              "sec: empty span"*) echo "::notice::$out" ;;
              *) echo "$out" ;;
            esac
          }
          echo "── base logic ($base)"
          guard "$base_sh"
          echo "── this change's logic"
          guard scripts/dev/review.sh

  # Lint the host ops scripts and run the whole hermetic shell-test block through
  # the aggregator (fake releases over file://, stubbed docker — no real stack).
  # --severity=warning so pre-existing info-level notes don't gate; the new
  # scripts are clean at default.
  ops-scripts:
    name: Ops scripts (shellcheck + update test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: shellcheck
        # The frps supervisor runs under the busybox sh of its image, so it is checked as
        # POSIX sh, not as bash.
        run: |
          shellcheck --severity=warning scripts/*.sh scripts/tests/*.sh scripts/dev/*.sh scripts/dev/hooks/*.sh scripts/release/*.sh scripts/vm/*.sh apps/*/docker-entrypoint.sh
          shellcheck --severity=warning -s sh apps/frps/frps-supervisor.sh
      # minisign lets the sandbox tests exercise the (armed) release-signature
      # verification path end-to-end with a throwaway key. Without it those tests
      # exit 75 = SKIP, and --strict below turns that into a failure — which is
      # the point: this job must not go green on a signature path that never ran.
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      # gnome-keyring lets lib_e2e_stack_test.sh run its keyring cases against a
      # real daemon in a D-Bus session of the test's own. Without it the test exits
      # 75 = SKIP, and --strict below turns that into a failure. The runner has
      # dbus-run-session, dbus-send, python3 and pgrep already; the package lists
      # come from the apt-get update of the step above.
      - name: Install gnome-keyring
        run: sudo apt-get install -y -qq --no-install-recommends gnome-keyring
      # The unit layer's `vm-pytest` step runs scripts/vm/tests here. Without
      # pytest the step SKIPs, and --strict turns that into a failure — which is
      # the point: this job must not go green on a suite that never ran.
      # Pinned for the reason ruff is: a new release changes collection or
      # deprecation behaviour and would red every open PR with no code change.
      - name: Install pytest
        run: pip install pytest==9.1.1
      # openapi_breaking_test checks the ERR exception file against the real
      # oasdiff matcher; without the binary it exits 75, and --strict turns that
      # into a failure. The same step as openapi-compat (anchor above): one pin.
      - *install-oasdiff
      # One aggregator call instead of eight lines: the same block a developer
      # runs locally, so CI and the dev box cannot drift apart. --strict makes a
      # skipped test a failure here, where every precondition is available.
      - name: Hermetic shell tests
        run: bash scripts/tests/run.sh unit --strict --only scripts
      # Does the documentation still describe this tree? Every <code>apps/…</code>
      # in docs/**/*.html has to name a file that exists (--paths), and a <code>
      # that is one ALL_CAPS name has to be carried by the repository outside the
      # docs (--env). --env gates since R-0044 triaged it to zero findings, as the
      # 8a plan intended (gate at five exceptions or fewer). Both flags: --env alone
      # turns the path check off.
      - name: Documentation smoke test
        run: python3 scripts/dev/doc-smoke.py --paths --env --strict

  gateway-config:
    name: Gateway (nginx -t)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # Syntax-check the single public TLS edge on every PR: the integration-stack
      # job below skips PRs and docker.yml only builds on releases, so a broken
      # nginx.conf (bad directive, missing snippet include) would otherwise merge and
      # only surface on the next main push (6.47). Throwaway certs + a stub mtls
      # snippet + the real identity snippet let `nginx -t` load the full config.
      - name: nginx -t with throwaway certs
        run: |
          mkdir -p certs snippets
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout certs/gateway.key -out certs/gateway-fullchain.pem -subj /CN=t -days 1
          cp certs/gateway-fullchain.pem certs/client-ca.pem
          echo 'ssl_verify_client optional;' > snippets/data-plane-mtls.conf
          cp apps/gateway/identity-headers.conf snippets/identity-headers.conf
          docker run --rm \
            -v "$PWD/apps/gateway/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/certs:/etc/nginx/certs:ro" \
            -v "$PWD/snippets:/etc/nginx/snippets:ro" \
            nginx:1.29-alpine nginx -t

  # The ONE from-outside integration path. Every other test mocks at the DB/IPC
  # boundary; this boots the real multi-container stack (postgres, redis, server,
  # ca-issuer, gateway) with MTLS_ENFORCE=true and talks to it only through the
  # nginx gateway — exercising the full enrollment + mTLS + JWT round-trip end to
  # end. The script builds the images it needs from this checkout.
  #
  # Deliberately NOT a per-PR gate yet: it builds the server image (incl. the web
  # frontend) and boots a five-container stack — minutes, not seconds. Runs on
  # main pushes + manual dispatch; promote to `pull_request` once we've lived a
  # release round with it.
  integration-stack:
    name: From-outside stack (mTLS gateway)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: From-outside mTLS integration test
        run: bash scripts/tests/integration_stack_test.sh

  # NOTE: the desktop E2E (WebdriverIO + tauri-driver smoke) is deliberately NOT
  # a CI job. Like the desktop *.live.js journeys it drives a real WebKit window
  # headless under xvfb — a chain (tauri-driver → WebKitWebDriver → WebKit) that
  # drifts with the runner image + ungated upstream tool versions, so it flaked
  # and reddened main without signalling a real defect. It runs locally/manually:
  #   cd apps/desktop/e2e && xvfb-run -a npm test
  # See apps/desktop/e2e/README.md.
