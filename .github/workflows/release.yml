name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A deleted+re-pushed tag (the usual "re-run the release" move) would otherwise start a
# second run parallel to the first, both writing the same draft with mixed assets (4.89).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FRP_VERSION: "0.69.1"
  # Pinned SHA-256 of the official frp release artifacts (verified before use).
  FRP_SHA256_LINUX_AMD64: "7be257b72dbbc60bcb3e0e25a5afd1dfac7b63f897084864d3c956dd3d5674e1"
  FRP_SHA256_WINDOWS_AMD64: "829ac915f8655d4d4e021b8db61b46c3445205ed80d32b04cda7fa89d87c46e0"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Desktop client: Tauri bundles (.deb + .rpm) and the raw ELF binary.
  # Tauri bundles the RPM via the Rust `rpm` crate, so no system rpmbuild needed.
  # ─────────────────────────────────────────────────────────────────────────
  desktop-linux:
    name: Desktop (deb/rpm/bin, Linux)
    # Only on a tag: a workflow_dispatch from a branch yields VERSION=main (non-semver),
    # failing build-deb/rpm after a full build and burning runner minutes (4.90).
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Install Tauri CLI
        # Exact pin (audit C6): "^2" floated to whatever was newest at build
        # time — a tauri-cli release could break a tag build and made release
        # builds non-reproducible. Keep in lockstep with ci.yml.
        run: cargo install tauri-cli --locked --version "2.11.2"
      - name: frpc sidecar
        run: |
          curl -fsSL -o frpc.tar.gz \
            "https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz"
          echo "${FRP_SHA256_LINUX_AMD64}  frpc.tar.gz" | sha256sum -c -
          tar xzf frpc.tar.gz
          mkdir -p apps/desktop/src-tauri/binaries
          cp "frp_${FRP_VERSION}_linux_amd64/frpc" \
            apps/desktop/src-tauri/binaries/frpc-x86_64-unknown-linux-gnu
          chmod +x apps/desktop/src-tauri/binaries/frpc-x86_64-unknown-linux-gnu
      - name: npm ci
        working-directory: apps/desktop/ui
        run: npm ci --no-audit --no-fund
      - name: Build bundles
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles deb,rpm
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb dist/
          cp apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm dist/
          cp apps/desktop/src-tauri/target/release/adminhelper dist/adminhelper-desktop-linux-x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-linux
          path: dist/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Go agent: linux + windows binaries, plus .deb and .rpm (bundling frpc).
  # ─────────────────────────────────────────────────────────────────────────
  agent:
    name: Go Agent (deb/rpm/bins)
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
          cache-dependency-path: apps/agent/go.sum
      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build binaries
        working-directory: apps/agent
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        # Build THROUGH the Makefile, not an inline `go build`: build-linux pins
        # CGO_ENABLED=0 for a fully static binary. An inline build inherits the
        # runner's default CGO_ENABLED=1 (gcc present) and dynamically links the
        # host glibc (2.39) — the released agent then won't start on older distros
        # (GLIBC_2.34 not found on Debian Stretch / RHEL 8 / UniFi firmware), while
        # the crabbox tests — which DO use `make` — stayed green. One build
        # definition means the tested binary is the shipped binary.
        run: make build-linux build-windows
      # The Makefile pins CGO_ENABLED=0, but nothing checked the RESULT. Defect
      # 4120005 shipped a dynamically linked agent (GLIBC_2.34 not found on older
      # distros) because the build had been inlined; the tests stayed green
      # because they build through `make`. Assert the property, not the recipe.
      - name: Assert static agent binary
        run: |
          set -euo pipefail
          bin=apps/agent/bin/adminhelper-agent
          # `|| true` below would also swallow a MISSING objdump, turning the
          # GLIBC_ assertion into a silent no-op — the very failure mode this
          # step exists against. Demand the tool first.
          command -v objdump >/dev/null || { echo "::error::objdump missing (binutils)"; exit 1; }
          ftype="$(file -b "$bin")"
          # objdump exits 1 with "not a dynamic object" on a static binary — that is
          # the good case, so don't let `set -e` (or pipefail) turn it into an error.
          syms="$(objdump -T "$bin" 2>&1 || true)"
          case "$ftype" in
            *"statically linked"*) ;;
            *)
              echo "::error::agent binary is not statically linked"
              echo "file: $ftype"; echo "objdump -T:"; echo "$syms"
              exit 1 ;;
          esac
          if printf '%s' "$syms" | grep -q 'GLIBC_'; then
            echo "::error::agent binary imports GLIBC_ symbols — it will not start on older distros"
            echo "file: $ftype"; echo "objdump -T:"; echo "$syms"
            exit 1
          fi
          echo "ok: static, no GLIBC_ imports — $ftype"
      - name: Download frpc (bundled into deb/rpm)
        run: |
          curl -fsSL -o frpc.tar.gz \
            "https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz"
          echo "${FRP_SHA256_LINUX_AMD64}  frpc.tar.gz" | sha256sum -c -
          tar xzf frpc.tar.gz
          cp "frp_${FRP_VERSION}_linux_amd64/frpc" ./frpc
          chmod +x frpc
      - name: Build .deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev
          VERSION="$VERSION" bash apps/agent/build-deb.sh
      - name: Build .rpm
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          VERSION="$VERSION" bash apps/agent/build-rpm.sh
      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp adminhelper-agent_*.deb dist/
          cp adminhelper-agent-*.rpm dist/
          cp apps/agent/bin/adminhelper-agent dist/adminhelper-agent-linux-x86_64
          cp apps/agent/bin/adminhelper-agent.exe dist/adminhelper-agent-windows-x86_64.exe
          # build-deb.sh guards its own output; this guards the artifact that is
          # actually uploaded. zstd members are unreadable by dpkg on Debian
          # Stretch/Buster and appliance firmware ("unknown compression for member").
          for deb in dist/adminhelper-agent_*.deb; do
            members="$(ar t "$deb")"
            if printf '%s' "$members" | grep -q '\.zst$'; then
              echo "::error::$deb uses zstd members — breaks dpkg on older targets"
              echo "$members"
              exit 1
            fi
            echo "ok: $deb members: $(printf '%s' "$members" | tr '\n' ' ')"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent
          path: dist/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # The Windows agent has never been EXECUTED before shipping — release.yml
  # cross-compiles it on ubuntu and uploads it unopened. `version` is the
  # cheapest proof that the .exe starts on Windows at all and carries the tag it
  # claims (a broken cross-build, a missing runtime, a stale ldflags VERSION).
  # Hard gate, ~1 min of windows-runner time per release.
  # ─────────────────────────────────────────────────────────────────────────
  agent-windows-smoke:
    name: Go Agent smoke (Windows)
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: agent
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: agent
          path: dist
      - name: The .exe runs and reports the tag version
        # bash, not pwsh: a multi-line `$out` from a pwsh call is a string ARRAY,
        # and `if ($out -notmatch …)` on an array filters instead of testing —
        # a subtly wrong assertion. The runners ship Git bash, which the
        # desktop-windows job already uses.
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          exe="dist/adminhelper-agent-windows-x86_64.exe"
          # Otherwise the commonest failure — the .exe missing from the artifact —
          # shows up as a bare exit 127 with no annotation.
          [ -f "$exe" ] || { echo "::error::$exe is not in the agent artifact"; exit 1; }
          out="$("./$exe" version)"
          echo "$exe version -> $out"
          # Match the whole printed line, not just the digits: a bare *"$VER"*
          # would also accept a neighbouring version (0.4.6 inside 10.4.62).
          case "$out" in
            *"adminhelper-agent $VER"*) echo "ok: the released .exe reports $VER" ;;
            *) echo "::error::$exe printed '$out' — expected 'adminhelper-agent $VER'"; exit 1 ;;
          esac

  # ─────────────────────────────────────────────────────────────────────────
  # Desktop client on Windows (MSI). Best-effort: first time this runs on a
  # GitHub Windows runner; failures must not block the release. If it fails,
  # the MSI is simply absent from the draft and can be added in a follow-up.
  # ─────────────────────────────────────────────────────────────────────────
  desktop-windows:
    name: Desktop (MSI, Windows, best-effort)
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Install Tauri CLI
        # Exact pin (audit C6): "^2" floated to whatever was newest at build
        # time — a tauri-cli release could break a tag build and made release
        # builds non-reproducible. Keep in lockstep with ci.yml.
        run: cargo install tauri-cli --locked --version "2.11.2"
      - name: frpc sidecar (windows)
        shell: bash
        run: |
          curl -fsSL -o frpc.zip \
            "https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_windows_amd64.zip"
          echo "${FRP_SHA256_WINDOWS_AMD64}  frpc.zip" | sha256sum -c -
          unzip -o frpc.zip
          mkdir -p apps/desktop/src-tauri/binaries
          cp "frp_${FRP_VERSION}_windows_amd64/frpc.exe" \
            apps/desktop/src-tauri/binaries/frpc-x86_64-pc-windows-msvc.exe
      - name: npm ci
        working-directory: apps/desktop/ui
        run: npm ci --no-audit --no-fund
      - name: Build MSI
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles msi
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp apps/desktop/src-tauri/target/release/bundle/msi/*.msi dist/
      # The MSI was only ever BUILT, never installed: a broken WiX template, a
      # missing sidecar or a bad install dir ships to the first user who runs it.
      # Install silently, believe the installer's own verdict, find the installed
      # exe, then remove it again so the runner is clean.
      #
      # AFTER "Collect artifacts" on purpose: a failed step ends the job, and the
      # job is continue-on-error — a false red here would silently drop the MSI
      # from the draft instead of merely reporting a problem (spec question 5:
      # visible WITHOUT blocking the release).
      - name: Install, verify and uninstall the MSI
        shell: pwsh
        # Start-Process -Wait waits for the whole process tree; a hung custom
        # action would otherwise sit here until the 6 h job default, with the
        # release job waiting on `needs`.
        timeout-minutes: 15
        run: |
          $msi = Get-ChildItem "dist/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { Write-Host "::error::the build produced no .msi"; exit 1 }
          $path = $msi.FullName
          # Absolute: Start-Process resolves a relative path against the PROCESS
          # working directory, which is not necessarily PowerShell's $PWD — the log
          # would land somewhere the assertion and the artifact upload never look.
          $log = Join-Path (Get-Location).Path 'msi.log'
          Write-Host "installing $path"
          $i = Start-Process msiexec.exe -ArgumentList '/i',"`"$path`"",'/qn','/norestart','/l*v',"`"$log`"" -Wait -PassThru
          Write-Host "msiexec /i exit: $($i.ExitCode)"
          # 3010 = ERROR_SUCCESS_REBOOT_REQUIRED: installed, just wants a reboot.
          if ($i.ExitCode -ne 0 -and $i.ExitCode -ne 3010) {
            Write-Host "::error::msiexec /i failed ($($i.ExitCode)) — see the desktop-windows-msi-log artifact"
            exit 1
          }
          if (-not (Test-Path $log)) { Write-Host "::error::msiexec wrote no log at $log"; exit 1 }
          if (-not (Select-String -Path $log -Pattern 'Installation success or error status: 0' -SimpleMatch -Quiet)) {
            Write-Host "::error::the MSI did not report a successful installation (see the desktop-windows-msi-log artifact)"
            exit 1
          }
          # Tauri's WiX template installs to %ProgramFiles%\<productName>\<productName>.exe,
          # and productName is "adminhelper" (tauri.conf.json). The install SCOPE is
          # UNVERIFIED — this job has never installed the MSI, and the Tauri docs
          # only pin NSIS's per-user location — so search the plausible roots
          # instead of failing on one guessed path.
          $exe = $null
          foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)}, (Join-Path $env:LOCALAPPDATA 'Programs'))) {
            if (-not $root -or -not (Test-Path $root)) { continue }
            $hit = Get-ChildItem $root -Filter 'adminhelper.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $exe = $hit.FullName; break }
          }
          if (-not $exe) {
            Write-Host "::error::no installed adminhelper.exe under ProgramFiles, ProgramFiles(x86) or LOCALAPPDATA\Programs"
            exit 1
          }
          Write-Host "ok: installed at $exe"
          $u = Start-Process msiexec.exe -ArgumentList '/x',"`"$path`"",'/qn','/norestart' -Wait -PassThru
          Write-Host "msiexec /x exit: $($u.ExitCode)"
          if ($u.ExitCode -ne 0 -and $u.ExitCode -ne 3010) { Write-Host "::error::MSI uninstall failed ($($u.ExitCode))"; exit 1 }
      # always(): the log matters most when the step above just failed.
      - name: Upload the MSI install log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-windows-msi-log
          path: msi.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: desktop-windows
          path: dist/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Gather every artifact, build SHA256SUMS, publish a DRAFT release.
  # draft: true -> nothing is public until a human presses "Publish".
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Draft GitHub Release
    needs: [desktop-linux, agent, agent-windows-smoke, desktop-windows]
    # Gate on the MANDATORY builds. desktop-windows is best-effort
    # (continue-on-error), so its failure must not block the draft — but a
    # failed desktop-linux, agent or agent-windows-smoke must, to avoid a
    # partial-asset draft that looks complete while missing core assets, or one
    # whose Windows agent does not start.
    if: ${{ !cancelled() && needs.desktop-linux.result == 'success' && needs.agent.result == 'success' && needs.agent-windows-smoke.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # The agent + Docker images derive their version from the tag, but six
      # places are bumped by hand — and this step only ever checked ONE of them
      # (tauri.conf.json), which is why the doc sidebar footers hung three
      # releases long. check-versions.sh checks all six and prints them as a
      # checklist; it is the same command .claude/rules/release.md tells Kevin to
      # run before tagging, so a red release here is never a surprise.
      - name: Verify every hand-maintained version matches the tag
        run: bash scripts/release/check-versions.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      # The release-bound updater (scripts/update.sh) consumes ONE versioned asset:
      # the runtime bundle. Its MANIFEST.sha256 + VERSION let the host verify and
      # atomically swap exactly this release's runtime files (compose + ops scripts).
      - name: Build runtime bundle
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release stage/scripts
          cp docker-compose.yml .env.example stage/
          cp scripts/install.sh scripts/update.sh scripts/init-secrets.sh \
             scripts/pg-backup.sh scripts/backup.sh scripts/restore.sh \
             scripts/uninstall.sh scripts/diagnostics.sh scripts/agent-install.sh \
             stage/scripts/
          printf '%s\n' "$TAG" > stage/VERSION
          ( cd stage && find docker-compose.yml .env.example scripts -type f | sort \
              | xargs sha256sum > MANIFEST.sha256 )
          tar czf "release/adminhelper-runtime-${TAG}.tar.gz" -C stage .
          echo "=== runtime bundle ==="; tar tzf "release/adminhelper-runtime-${TAG}.tar.gz"
      # The agent package repo (GPG-signed apt + rpm) as ONE asset the updater
      # drops into the gateway's ./repo. Built BEFORE "Flatten and checksum" so it
      # lands in SHA256SUMS (and thus the minisign signature). Skips with a warning
      # until REPO_GPG_PRIVATE_KEY is configured — like MINISIGN_SECRET_KEY it must
      # never block a release. Generate a PASSPHRASE-LESS key once, store
      # `gpg --export-secret-keys --armor <KEYID> | base64 -w0` as the secret, and
      # pin the public key in the docs + client setup snippet (docs/.../cicd).
      - name: Build signed agent repo (apt + rpm)
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${REPO_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::REPO_GPG_PRIVATE_KEY not set — the signed agent repo is mandatory (its fingerprint is pinned in the docs + client setup). A release without it silently leaves the fleet on the old repo — no new version, no error, no staleness signal (4.23)."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          mkdir -p release
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils createrepo-c rpm gnupg
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          # The decrypted repo signing key lives here — drop it when the step ends (even
          # on failure) so it isn't on disk while later third-party steps run (3.53).
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$REPO_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import 2>/dev/null \
            || { echo "::error::REPO_GPG_PRIVATE_KEY must be base64 of an exported secret key: gpg --export-secret-keys --armor <KEYID> | base64 -w0"; exit 1; }
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          # Assert the imported key matches the fingerprint pinned in the docs + client
          # setup (docs/admin/agent-deployment.html). A rotated/wrong/typo'd secret would
          # otherwise sign with a key the fleet's pinned keyring rejects (apt update
          # breaks), unnoticed until the field instead of failing here in CI (4.24).
          EXPECTED_FPR="912E1EC637F49C978EAD47DF926B404297E9DC1C"
          [ "$KEY_ID" = "$EXPECTED_FPR" ] || { echo "::error::imported signing key $KEY_ID != pinned $EXPECTED_FPR — wrong REPO_GPG_PRIVATE_KEY? (keep in sync with docs/admin/agent-deployment)"; exit 1; }
          DEB="$(ls artifacts/agent/adminhelper-agent_*_amd64.deb | head -1)"
          RPM="$(ls artifacts/agent/adminhelper-agent-*.x86_64.rpm | head -1)"
          VERSION="$VER" REPO_GPG_KEY_ID="$KEY_ID" OUT_DIR=repo DEB="$DEB" RPM="$RPM" \
            bash apps/agent/build-repo.sh
          tar czf "release/adminhelper-agent-repo-${TAG}.tar.gz" -C repo .
          # Also publish the archive keyring as its OWN asset — a second, independent
          # channel so an admin can fetch it and fingerprint-verify it against
          # SHA256SUMS + minisign, instead of only trusting the certless :8445 repo
          # plane it is meant to authenticate (3.21).
          cp repo/apt/adminhelper-archive-keyring.gpg release/
          # sed (not head) reads the whole stream, so tar never gets SIGPIPE — `tar | head`
          # under `set -o pipefail` fails the step with exit 2 once the listing exceeds 10 lines.
          echo "=== agent repo bundle ==="; tar tzf "release/adminhelper-agent-repo-${TAG}.tar.gz" | sed -n '1,10p'
      - name: Flatten and checksum
        run: |
          # download-artifact above has no `name`, so it pulls EVERY artifact of the
          # run, one directory each. Only PAYLOAD artifacts belong in release/:
          # desktop-windows-msi-log is diagnostics (verbose MSI log, runner paths)
          # and must not end up checksummed, minisign-signed and published.
          # Two filters on purpose — the directory name couples this line to the
          # upload step, the *.log name survives a rename or a second diagnostic
          # artifact. No release asset has ever been a .log.
          find artifacts -type f -not -path 'artifacts/desktop-windows-msi-log/*' \
            -not -name '*.log' -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          echo "=== Release assets ==="
          ls -lah
      # Sign SHA256SUMS so install.sh/update.sh can verify authenticity, not just
      # transport integrity (the bundle and SHA256SUMS come from the same origin).
      # Fails the release if MINISIGN_SECRET_KEY is missing: install.sh/update.sh are
      # armed (public key pinned) and reject unsigned releases, so an unsigned draft
      # would break every install/update in the field. Generate a passwordless CI key
      # once with `minisign -G -W`, store its secret-key file as the
      # MINISIGN_SECRET_KEY secret, and pin the matching public key in
      # scripts/install.sh + scripts/update.sh to arm it.
      - name: Sign SHA256SUMS (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY missing — install.sh/update.sh are armed and reject unsigned releases."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          # The secret is the base64 of the minisign.key FILE (`base64 -w0 minisign.key`),
          # which is paste-safe — a raw multi-line key easily gets its base64 line mangled
          # in the secret store ("base64 conversion failed" at sign time).
          printf '%s' "$MINISIGN_SECRET_KEY" | base64 -d > minisign.key 2>/dev/null \
            || { echo "::error::MINISIGN_SECRET_KEY must be the base64 of the key file: base64 -w0 minisign.key"; exit 1; }
          minisign -S -s minisign.key -m release/SHA256SUMS -x release/SHA256SUMS.minisig < /dev/null
          rm -f minisign.key
          # Verify against the key the FLEET pins, not against the secret we just
          # signed with: a rotated or wrong MINISIGN_SECRET_KEY produces a
          # perfectly valid signature that install.sh/update.sh reject — and that
          # only shows up on user machines, after the draft is published. The
          # public key lives in scripts/update.sh (kept in sync with install.sh).
          # Anchored, and tolerant of "no match" so the message below is what a
          # missing pin produces — an unanchored grep would also match the first
          # COMMENT mentioning the variable, and under pipefail its failure would
          # abort the step silently. Same form as ci.yml's lockstep check.
          PUB="$(grep -m1 '^MINISIGN_PUBKEY=' scripts/update.sh | cut -d'"' -f2 || true)"
          [ -n "$PUB" ] || { echo "::error::no MINISIGN_PUBKEY pinned in scripts/update.sh — nothing to verify the signature against"; exit 1; }
          minisign -V -P "$PUB" -m release/SHA256SUMS -x release/SHA256SUMS.minisig \
            || { echo "::error::SHA256SUMS.minisig does not verify against the public key pinned in scripts/update.sh — MINISIGN_SECRET_KEY is the wrong key; every install/update in the field would reject this release"; exit 1; }
          echo "Signed release/SHA256SUMS -> release/SHA256SUMS.minisig (verified against the pinned public key)"
      - name: Assert the tag images exist on ghcr
        # release.yml and docker.yml run independently on tag push, but install.sh/
        # update.sh pin ghcr.io/...:X.Y.Z hard. Creating the draft before docker.yml has
        # pushed the images means a human publishing it ships a release whose
        # `install.sh --ref` and `update.sh` fail with 'manifest unknown'. Poll for all
        # four (public images, no login); a red/still-running docker.yml fails THIS
        # workflow instead, so no draft with missing images is ever offered (4.25).
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          for img in server gateway ca-issuer monitoring; do
            ok=0
            for _ in $(seq 1 20); do
              if docker manifest inspect "ghcr.io/admincave/adminhelper/${img}:${VER}" >/dev/null 2>&1; then ok=1; break; fi
              sleep 30
            done
            [ "$ok" = 1 ] || { echo "::error::Image ${img}:${VER} missing on ghcr — docker.yml red or still running?"; exit 1; }
            echo "ok: ${img}:${VER}"
          done
      - name: Create draft release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          draft: true
          name: AdminHelper ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: release/*
