# Lint + Format für die Python-Komponenten (apps/server, apps/monitoring,
# apps/ca-issuer) und die Python-Skripte unter scripts/.
# CI: eigener python-lint-Job (ruff check + ruff format --check) über alle vier
# Pfade; `scripts/tests/run.sh lint` prüft dieselben (Schritte ruff und ruff-vm).
# Lokal: `ruff check apps/server apps/monitoring apps/ca-issuer scripts`.

# Genau das ruff, das CI pinnt (ci.yml, scripts/vm/bootstrap_linux.sh,
# apps/server/requirements-dev.txt; scripts/dev/toolchain-lockstep.sh prüft die
# Gleichheit). run.sh nimmt das erste ruff im PATH: ein anderes bricht hier mit
# Exit 2 ab, statt still andere Regeln anzuwenden.
required-version = "==0.17.4"
line-length = 100
target-version = "py313"

# docs/examples sind annotierte Beispiel-Skripte, data/ ist Laufzeit.
extend-exclude = ["docs", "data"]

[lint]
# Pyflakes + pycodestyle-Kern plus Import-Sortierung. Ausdrücklich, nicht als
# extend-select auf den Default: ruff 0.16 hat den Default von 59 auf 413 Regeln
# erweitert (mit 0.17.4 hier 1317 Treffer); das ist der Default bis 0.15.
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["app"]
